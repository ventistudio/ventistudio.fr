<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <meta name="theme-color" content="#6366f1">
    <meta name="description" content="Page not found. Return to VentiStudio home.">
    <title>404 - Page Not Found</title>
    
    <!-- Preload resources -->
    <link rel="preload" href="/style.css" as="style">
    <link rel="preload" href="/script.js" as="script" defer>
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="/style.css">
    
    <!-- Favicon -->
    <link rel="icon" href="/favicon.avif" type="image/avif">
</head>
<body>
    <div style="
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 100%);
        color: #e0e0e0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        padding: 20px;
        text-align: center;
    ">
        <div style="
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 60px 40px;
            max-width: 500px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(99, 102, 241, 0.2);
        ">
            <h1 style="
                font-size: 120px;
                margin: 0 0 20px 0;
                color: #6366f1;
                font-weight: 900;
                text-shadow: 0 0 30px rgba(99, 102, 241, 0.5);
            ">404</h1>
            
            <h2 style="
                font-size: 32px;
                margin: 0 0 15px 0;
                color: #ffffff;
            ">Page Not Found</h2>
            
            <p style="
                font-size: 16px;
                color: #b0b0b0;
                margin: 0 0 20px 0;
                line-height: 1.6;
            ">
                The page you're looking for might have been removed, had its name changed, or is temporarily unavailable.
            </p>
            
            <nav style="
                display: flex;
                gap: 10px;
                justify-content: center;
                flex-wrap: wrap;
                margin-top: 30px;
            ">
                <a href="/" style="
                    display: inline-block;
                    padding: 12px 30px;
                    background: linear-gradient(135deg, #6366f1, #9333ea);
                    color: white;
                    text-decoration: none;
                    border-radius: 8px;
                    font-weight: 600;
                    transition: all 0.3s ease;
                    border: 1px solid transparent;
                ">Go Home</a>
                
                <a href="/about/" style="
                    display: inline-block;
                    padding: 12px 30px;
                    background: transparent;
                    color: #6366f1;
                    text-decoration: none;
                    border-radius: 8px;
                    font-weight: 600;
                    border: 2px solid #6366f1;
                    transition: all 0.3s ease;
                ">About Us</a>
            </nav>
            
            <p style="
                font-size: 12px;
                color: #808080;
                margin-top: 40px;
                margin-bottom: 0;
            ">
                Error Code: 404 | <a href="/" style="color: #6366f1; text-decoration: none;">Return to Home</a>
            </p>
        </div>
        
        <footer style="
            margin-top: 60px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            color: #808080;
            font-size: 12px;
        ">
            <p>© 2023-2026 VentiStudio - Product by AINA UMAISHI</p>
            <p><a href="/sitemap/" style="color: #6366f1; text-decoration: none;">Sitemap</a> | 
               <a href="/privacy/" style="color: #6366f1; text-decoration: none;">Privacy</a> | 
               <a href="/terms/" style="color: #6366f1; text-decoration: none;">Terms</a></p>
        </footer>
    </div>
    
    <!-- JavaScript -->
    <script defer src="/script.js"></script>
</body>
</html>
