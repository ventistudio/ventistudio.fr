  <style>
    :root {
      --bg: #1A1B26;
      --accent: #6366f1;
    }
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: #fff;
      font-family: 'Inter', sans-serif;
    }
    .hero-section {
      text-align: center;
    }
    .spinner {
      width: 60px;
      height: 60px;
      border: 4px solid rgba(99, 102, 241, 0.2);
      border-top: 4px solid var(--accent);
      border-radius: 50%;
      margin: 0 auto 1.5rem;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    h1 {
      font-size: 1.5rem;
      opacity: .8;
      animation: fade 1.5s ease-in-out infinite;
    }
    @keyframes fade {
      0%, 100% { opacity: .8; }
      50% { opacity: .4; }
    }
  </style>
