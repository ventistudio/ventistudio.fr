<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Breach Protocol - Interface sociale VentiStudio.">
  <meta name="theme-color" content="#6366f1">
  <title>BREACH PROTOCOL // VentiStudio</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Chakra+Petch:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap');

    :root {
      --cyan: #00e5ff;
      --cyan-bright: #00ffff;
      --cyan-dim: #006a75;
      --yellow: #f7e54d;
      --yellow-bright: #fcee09;
      --red: #ea0038;
      --red-dim: #80001f;
      --magenta: #d400aa;
      --bg-deep: #06080c;
      --bg-panel: #0c1117;
      --bg-element: #0e161e;
      --border-subtle: rgba(0, 229, 255, 0.08);
      --text-main: #c5dce3;
      --text-dim: #3a5a67;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg-deep);
      color: var(--text-main);
      font-family: 'Chakra Petch', sans-serif;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* ═══ BACKGROUND: Subtle circuit traces ═══ */
    .bg-circuits {
      position: fixed;
      inset: 0;
      z-index: 0;
      opacity: 0.04;
      background-image:
        linear-gradient(90deg, var(--cyan) 1px, transparent 1px),
        linear-gradient(var(--cyan) 1px, transparent 1px);
      background-size: 80px 80px;
    }

    .bg-noise {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.015'/%3E%3C/svg%3E");
      pointer-events: none;
    }

    /* ═══ CHROMATIC ABERRATION OVERLAY ═══ */
    .chromatic-shift {
      position: fixed;
      inset: 0;
      z-index: 9998;
      pointer-events: none;
      mix-blend-mode: screen;
      opacity: 0;
      animation: chromaFlash 8s ease-in-out infinite;
    }

    @keyframes chromaFlash {
      0%, 90%, 100% { opacity: 0; }
      92% { opacity: 0.08; }
      94% { opacity: 0; }
      95% { opacity: 0.12; }
      96% { opacity: 0; }
    }

    .chromatic-shift::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(234,0,56,0.3) 0%, transparent 33%, transparent 66%, rgba(0,229,255,0.3) 100%);
    }

    /* ═══ FULL-SCREEN LAYOUT ═══ */
    .breach-screen {
      position: relative;
      z-index: 1;
      width: 100vw;
      height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      grid-template-columns: 1fr;
    }

    /* ═══ TOP BAR yellow warning strip ═══ */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.6rem 2rem;
      background: linear-gradient(90deg, var(--yellow) 0%, var(--yellow-bright) 50%, var(--yellow) 100%);
      color: #0a0a0a;
      font-family: 'Chakra Petch', sans-serif;
      font-weight: 700;
      font-size: 0.75rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      position: relative;
      z-index: 10;
    }

    .top-bar::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 0; right: 0;
      height: 4px;
      background: linear-gradient(180deg, rgba(247,229,77,0.3), transparent);
    }

    .top-bar .left { display: flex; align-items: center; gap: 0.5rem; }
    .top-bar .right { font-family: 'Share Tech Mono', monospace; font-weight: 400; font-size: 0.65rem; letter-spacing: 1px; opacity: 0.7; }

    .top-bar .warning-icon {
      display: inline-block;
      width: 0; height: 0;
      border-left: 7px solid transparent;
      border-right: 7px solid transparent;
      border-bottom: 12px solid #0a0a0a;
      position: relative;
      top: -1px;
    }

    /* ═══ MAIN CONTENT ═══ */
    .main-area {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      padding: 1.5rem 2rem;
      overflow-y: auto;
    }

    /* ═══ LEFT SIDE: BREACH MATRIX ═══ */
    .left-col {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    /* Section headers - CP2077 style with skewed accent */
    .section-header {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 0.4rem;
    }

    .section-header .accent-bar {
      width: 3px;
      height: 16px;
      background: var(--cyan);
      transform: skewX(-12deg);
      box-shadow: 0 0 8px rgba(0, 229, 255, 0.4);
    }

    .section-header h2 {
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: 0.7rem;
      color: var(--cyan);
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    /* Matrix container */
    .matrix-container {
      background: var(--bg-panel);
      border: 1px solid var(--border-subtle);
      padding: 1.2rem;
      position: relative;
    }

    .matrix-container::before {
      content: 'CODE MATRIX';
      position: absolute;
      top: -8px;
      left: 12px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.5rem;
      color: var(--cyan-dim);
      letter-spacing: 2px;
      background: var(--bg-panel);
      padding: 0 6px;
    }

    .matrix-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 3px;
    }

    .m-cell {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-dim);
      background: rgba(0, 229, 255, 0.02);
      border: 1px solid rgba(0, 229, 255, 0.05);
      cursor: default;
      transition: all 0.25s;
      position: relative;
    }

    .m-cell.highlight {
      color: var(--cyan-bright);
      background: rgba(0, 229, 255, 0.08);
      border-color: var(--cyan);
      box-shadow: 0 0 12px rgba(0, 229, 255, 0.15), inset 0 0 15px rgba(0, 229, 255, 0.05);
      text-shadow: 0 0 8px var(--cyan);
    }

    .m-cell.selected {
      color: var(--yellow);
      background: rgba(247, 229, 77, 0.08);
      border-color: rgba(247, 229, 77, 0.4);
      text-shadow: 0 0 6px var(--yellow);
    }

    .m-cell.row-highlight {
      background: rgba(0, 229, 255, 0.04);
      border-color: rgba(0, 229, 255, 0.12);
    }

    /* Sequence required */
    .sequence-required {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.8rem;
      padding: 0.5rem 0;
    }

    .seq-label {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.5rem;
      color: var(--text-dim);
      letter-spacing: 2px;
      white-space: nowrap;
    }

    .seq-codes {
      display: flex;
      gap: 4px;
    }

    .seq-code {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.7rem;
      color: var(--cyan);
      padding: 2px 8px;
      border: 1px solid rgba(0, 229, 255, 0.2);
      background: rgba(0, 229, 255, 0.04);
    }

    .seq-code.matched {
      color: var(--yellow);
      border-color: rgba(247, 229, 77, 0.4);
      background: rgba(247, 229, 77, 0.08);
    }

    /* ═══ BUFFER ═══ */
    .buffer-container {
      background: var(--bg-panel);
      border: 1px solid var(--border-subtle);
      padding: 1rem 1.2rem;
      position: relative;
    }

    .buffer-container::before {
      content: 'BUFFER';
      position: absolute;
      top: -8px;
      left: 12px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.5rem;
      color: var(--cyan-dim);
      letter-spacing: 2px;
      background: var(--bg-panel);
      padding: 0 6px;
    }

    .buffer-slots {
      display: flex;
      gap: 4px;
    }

    .b-slot {
      flex: 1;
      height: 36px;
      border: 1px solid rgba(0, 229, 255, 0.1);
      background: rgba(0, 229, 255, 0.015);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.75rem;
      color: var(--text-dim);
      transition: all 0.4s;
      position: relative;
    }

    .b-slot::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0;
      width: 100%; height: 2px;
      background: var(--cyan);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .b-slot.filled {
      border-color: rgba(0, 229, 255, 0.3);
      color: var(--cyan-bright);
      background: rgba(0, 229, 255, 0.06);
      text-shadow: 0 0 6px var(--cyan);
    }

    .b-slot.filled::after {
      opacity: 0.6;
    }

    .b-slot.current {
      border-color: var(--yellow);
      box-shadow: 0 0 10px rgba(247, 229, 77, 0.15);
    }

    .b-slot.current::after {
      background: var(--yellow);
      opacity: 0.8;
      animation: bufferPulse 1s ease-in-out infinite;
    }

    @keyframes bufferPulse {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 0.3; }
    }

    /* Timer bar */
    .timer-section {
      margin-top: 0.8rem;
    }

    .timer-track {
      height: 3px;
      background: rgba(0, 229, 255, 0.08);
      position: relative;
      overflow: hidden;
    }

    .timer-fill {
      height: 100%;
      width: 100%;
      background: var(--red);
      box-shadow: 0 0 8px var(--red);
      transition: width 0.5s linear;
    }

    .timer-label {
      display: flex;
      justify-content: space-between;
      margin-top: 0.3rem;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.5rem;
      color: var(--text-dim);
      letter-spacing: 1px;
    }

    .timer-label .time-val {
      color: var(--red);
      font-size: 0.55rem;
    }

    /* ═══ RIGHT SIDE: DAEMONS ═══ */
    .right-col {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    /* Daemon cards */
    .daemon-stack {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .daemon-card {
      background: var(--bg-panel);
      border: 1px solid var(--border-subtle);
      padding: 0.8rem 1rem;
      position: relative;
      overflow: hidden;
      opacity: 0.4;
      transition: all 0.5s;
    }

    .daemon-card::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: var(--text-dim);
      transition: background 0.4s, box-shadow 0.4s;
    }

    .daemon-card.active {
      opacity: 1;
      border-color: rgba(0, 229, 255, 0.15);
    }

    .daemon-card.active::before {
      background: var(--cyan);
      box-shadow: 0 0 6px var(--cyan);
    }

    .daemon-card.uploaded {
      opacity: 1;
      border-color: rgba(247, 229, 77, 0.2);
    }

    .daemon-card.uploaded::before {
      background: var(--yellow);
      box-shadow: 0 0 6px var(--yellow);
    }

    .daemon-card.failed {
      opacity: 0.5;
      border-color: rgba(234, 0, 56, 0.15);
    }

    .daemon-card.failed::before {
      background: var(--red);
      box-shadow: 0 0 6px var(--red);
    }

    .daemon-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.3rem;
    }

    .daemon-name {
      font-family: 'Orbitron', sans-serif;
      font-weight: 600;
      font-size: 0.65rem;
      letter-spacing: 2px;
      color: var(--text-main);
    }

    .daemon-card.uploaded .daemon-name { color: var(--yellow); }
    .daemon-card.failed .daemon-name { color: var(--red); text-decoration: line-through; }

    .daemon-badge {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.5rem;
      letter-spacing: 1px;
      padding: 1px 8px;
      text-transform: uppercase;
    }

    .daemon-badge.pending {
      color: var(--text-dim);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .daemon-badge.success {
      color: var(--yellow);
      border: 1px solid rgba(247, 229, 77, 0.3);
      background: rgba(247, 229, 77, 0.06);
    }

    .daemon-badge.error {
      color: var(--red);
      border: 1px solid rgba(234, 0, 56, 0.3);
      background: rgba(234, 0, 56, 0.06);
    }

    .daemon-desc {
      font-size: 0.65rem;
      color: var(--text-dim);
      line-height: 1.4;
      margin-bottom: 0.4rem;
    }

    .daemon-seq {
      display: flex;
      gap: 3px;
    }

    .daemon-seq-code {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.6rem;
      padding: 1px 6px;
      color: var(--cyan-dim);
      border: 1px solid rgba(0, 229, 255, 0.08);
      background: rgba(0, 229, 255, 0.02);
    }

    .daemon-card.uploaded .daemon-seq-code {
      color: var(--yellow);
      border-color: rgba(247, 229, 77, 0.2);
    }

    /* ═══ SYSTEM LOG (bottom of right col) ═══ */
    .sys-log {
      background: var(--bg-panel);
      border: 1px solid var(--border-subtle);
      padding: 0.8rem 1rem;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.58rem;
      line-height: 1.9;
      color: var(--text-dim);
      max-height: 150px;
      overflow: hidden;
      position: relative;
      flex: 1;
    }

    .sys-log::before {
      content: 'SYSTEM LOG';
      position: absolute;
      top: -8px;
      left: 12px;
      font-size: 0.5rem;
      color: var(--cyan-dim);
      letter-spacing: 2px;
      background: var(--bg-panel);
      padding: 0 6px;
    }

    .log-entry {
      opacity: 0;
      animation: logIn 0.2s forwards;
    }

    .log-entry .t { color: rgba(0, 229, 255, 0.25); }
    .log-entry .ok { color: var(--cyan); }
    .log-entry .warn { color: var(--yellow); }
    .log-entry .err { color: var(--red); }
    .log-entry .sys { color: var(--magenta); }

    @keyframes logIn {
      from { opacity: 0; transform: translateX(-4px); }
      to { opacity: 1; transform: translateX(0); }
    }

    /* ═══ BOTTOM BAR ═══ */
    .bottom-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.5rem 2rem;
      background: var(--bg-panel);
      border-top: 1px solid var(--border-subtle);
      z-index: 10;
    }

    .bottom-left {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .bottom-left .tag {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.5rem;
      color: var(--text-dim);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .bottom-left .tag .val {
      color: var(--cyan);
    }

    .bottom-right {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .redirect-timer {
      font-family: 'Orbitron', sans-serif;
      font-weight: 600;
      font-size: 0.7rem;
      color: var(--yellow);
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(247, 229, 77, 0.3);
    }

    .exit-hint {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.5rem;
      color: var(--text-dim);
      letter-spacing: 1px;
    }

    .exit-hint kbd {
      display: inline-block;
      padding: 1px 6px;
      border: 1px solid rgba(0, 229, 255, 0.15);
      color: var(--cyan);
      font-size: 0.5rem;
      margin: 0 2px;
      background: rgba(0, 229, 255, 0.04);
    }

    /* ═══ CP2077 SKEWED DECORATIVE LINES ═══ */
    .skew-line {
      position: fixed;
      background: var(--cyan);
      opacity: 0.03;
      pointer-events: none;
      z-index: 0;
    }

    .skew-line-1 {
      width: 200%;
      height: 1px;
      top: 30%;
      left: -50%;
      transform: rotate(-15deg);
    }

    .skew-line-2 {
      width: 200%;
      height: 1px;
      top: 70%;
      left: -50%;
      transform: rotate(10deg);
    }

    .skew-line-3 {
      width: 1px;
      height: 200%;
      left: 20%;
      top: -50%;
      transform: rotate(5deg);
    }

    /* ═══ GLITCH FLASH ═══ */
    @keyframes screenGlitch {
      0%, 97%, 100% { transform: none; filter: none; }
      97.5% { transform: translate(-2px, 1px); filter: hue-rotate(90deg) saturate(2); }
      98% { transform: translate(3px, -1px) skewX(-0.5deg); filter: hue-rotate(-60deg) brightness(1.2); }
      98.5% { transform: translate(-1px, 0); filter: none; }
    }

    .breach-screen {
      animation: screenGlitch 12s ease-in-out infinite;
    }

    /* ═══ RESPONSIVE ═══ */
    @media (max-width: 768px) {
      .main-area {
        grid-template-columns: 1fr;
        padding: 1rem;
        gap: 1rem;
      }
      .top-bar { padding: 0.5rem 1rem; font-size: 0.6rem; }
      .bottom-bar { flex-direction: column; gap: 0.4rem; padding: 0.5rem 1rem; }
      .bottom-left { gap: 0.8rem; }
      .matrix-grid { grid-template-columns: repeat(6, 1fr); }
      .m-cell { font-size: 0.65rem; }
    }
  </style>

  <div class="breach-screen">

    <!-- ═══ TOP YELLOW BAR ═══ -->

    <!-- ═══ MAIN ═══ -->
    <div class="main-area">

      <!-- LEFT COLUMN -->
      <div class="left-col">

        <div class="section-header">
          <div class="accent-bar"></div>
          <h2>Code Matrix</h2>
        </div>

        <div class="matrix-container">
          <div class="matrix-grid" id="matrix"></div>
          <div class="sequence-required">
            <span class="seq-label">SÉQUENCE :</span>
            <div class="seq-codes" id="seq-display"></div>
          </div>
        </div>

        <div class="buffer-container">
          <div class="buffer-slots" id="buffer"></div>

      <div class="right-col">

        <div class="section-header">

        <div class="daemon-stack" id="daemon-stack"></div>

    <!-- ═══ BOTTOM BAR ═══ -->
    <div class="bottom-bar">

  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const dest = urlParams.get('daemon') || urlParams.get('deamon');
      const redirectUrl = dest ? decodeURIComponent(dest) : '/';
      const TOTAL_TIME = 10;
      let countdown = TOTAL_TIME;

      // ── Time display ──
      const topTime = document.getElementById('top-time');
      function updateTime() {
        const now = new Date();
        topTime.textContent = now.toTimeString().slice(0,8) + ' // ' +
          now.toLocaleDateString('fr-FR', { day:'2-digit', month:'2-digit', year:'numeric' });
      }
      updateTime();
      setInterval(updateTime, 1000);

      // ── Matrix (6x6) ──
      const HEX_VALS = ['1C', 'BD', '55', 'E9', '7A', 'FF'];
      const matrixEl = document.getElementById('matrix');
      const cells = [];
      for (let r = 0; r < 6; r++) {
        for (let c = 0; c < 6; c++) {
          const cell = document.createElement('div');
          cell.className = 'm-cell';
          cell.textContent = HEX_VALS[Math.floor(Math.random() * HEX_VALS.length)];
          cell.dataset.row = r;
          cell.dataset.col = c;
          matrixEl.appendChild(cell);
          cells.push(cell);
        }
      }

      // Sequence to match
      const SEQ = ['1C', 'BD', '55', 'E9'];
      const seqDisplay = document.getElementById('seq-display');
      SEQ.forEach(code => {
        const el = document.createElement('div');
        el.className = 'seq-code';
        el.textContent = code;
        seqDisplay.appendChild(el);
      });

      // Animate matrix selection
      let selectRow = true;
      let currentRow = 0;
      let currentCol = -1;
      let seqIdx = 0;

      function highlightRow(r) {
        cells.forEach(c => c.classList.remove('row-highlight', 'highlight'));
        cells.filter(c => parseInt(c.dataset.row) === r).forEach(c => c.classList.add('row-highlight'));
      }
      function highlightCol(c) {
        cells.forEach(cl => cl.classList.remove('row-highlight', 'highlight'));
        cells.filter(cl => parseInt(cl.dataset.col) === c).forEach(cl => cl.classList.add('row-highlight'));
      }

      highlightRow(0);

      function findTarget() {
        const targetVal = seqIdx < SEQ.length ? SEQ[seqIdx] : HEX_VALS[Math.floor(Math.random() * HEX_VALS.length)];
        let candidates;
        if (selectRow) {
          candidates = cells.filter(c => parseInt(c.dataset.row) === currentRow && !c.classList.contains('selected'));
        } else {
          candidates = cells.filter(c => parseInt(c.dataset.col) === currentCol && !c.classList.contains('selected'));
        }
        let match = candidates.find(c => c.textContent === targetVal);
        if (!match && candidates.length > 0) {
          match = candidates[Math.floor(Math.random() * candidates.length)];
          match.textContent = targetVal;
        }
        return match;
      }

      const selectInterval = setInterval(() => {
        const target = findTarget();
        if (!target) { clearInterval(selectInterval); return; }

        target.classList.remove('row-highlight');
        target.classList.add('highlight');

        setTimeout(() => {
          target.classList.remove('highlight');
          target.classList.add('selected');
          fillNextBuffer(target.textContent);

          if (seqIdx < SEQ.length && target.textContent === SEQ[seqIdx]) {
            seqDisplay.children[seqIdx].classList.add('matched');
            seqIdx++;
          }

          if (selectRow) {
            currentCol = parseInt(target.dataset.col);
            selectRow = false;
            highlightCol(currentCol);
          } else {
            currentRow = parseInt(target.dataset.row);
            selectRow = true;
            highlightRow(currentRow);
          }
        }, 500);
      }, 1200);

      // ── Buffer ──
      const bufferEl = document.getElementById('buffer');
      const BUFFER_SIZE = 8;
      for (let i = 0; i < BUFFER_SIZE; i++) {
        const slot = document.createElement('div');
        slot.className = 'b-slot' + (i === 0 ? ' current' : '');
        slot.textContent = '[ ]';
        bufferEl.appendChild(slot);
      }
      let bufferIdx = 0;

      function fillNextBuffer(val) {
        if (bufferIdx >= BUFFER_SIZE) return;
        const slots = bufferEl.querySelectorAll('.b-slot');
        slots[bufferIdx].classList.remove('current');
        slots[bufferIdx].classList.add('filled');
        slots[bufferIdx].textContent = val;
        bufferIdx++;
        if (bufferIdx < BUFFER_SIZE) {
          slots[bufferIdx].classList.add('current');
        }
      }

      // ── Daemons ──
      const daemonStack = document.getElementById('daemon-stack');
      const daemons = [
        { name: 'DATAMINE_V1', desc: 'Extrait les eurodollars du sous-réseau.', seq: ['1C', '1C', 'BD'], status: 'pending' },
        { name: 'DATAMINE_V2', desc: 'Extraction de données avancée.', seq: ['BD', '1C', '1C', 'BD'], status: 'pending' },
        { name: 'ICEPICK', desc: 'Réduit le coût RAM des quickhacks de 1.', seq: ['55', '1C', 'BD'], status: 'pending' },
        { name: 'MASS VULNERABILITY', desc: 'Applique une vulnérabilité aux ennemis.', seq: ['E9', 'E9', 'BD'], status: 'pending' },
      ];

      daemons.forEach(d => {
        const card = document.createElement('div');
        card.className = 'daemon-card';
        card.innerHTML = `
          <div class="daemon-top">
            <span class="daemon-name">${d.name}</span>
            <span class="daemon-badge pending">EN ATTENTE</span>
          </div>
          <div class="daemon-desc">${d.desc}</div>
          <div class="daemon-seq">${d.seq.map(s => `<span class="daemon-seq-code">${s}</span>`).join('')}</div>
        `;
        daemonStack.appendChild(card);
      });

      let daemonIdx = 0;
      const cards = daemonStack.querySelectorAll('.daemon-card');

      setTimeout(() => {
        const daemonAnim = setInterval(() => {
          if (daemonIdx >= daemons.length) { clearInterval(daemonAnim); return; }

          cards[daemonIdx].classList.add('active');
          const badge = cards[daemonIdx].querySelector('.daemon-badge');
          const capturedIdx = daemonIdx;

          setTimeout(() => {
            const success = daemons[capturedIdx].name !== 'MASS VULNERABILITY';
            cards[capturedIdx].classList.remove('active');
            if (success) {
              cards[capturedIdx].classList.add('uploaded');
              badge.className = 'daemon-badge success';
              badge.textContent = 'UPLOADED';
            } else {
              cards[capturedIdx].classList.add('failed');
              badge.className = 'daemon-badge error';
              badge.textContent = 'ÉCHOUÉ';
            }
          }, 1000);

          daemonIdx++;
        }, 1800);
      }, 2000);

      // ── System log ──
      const sysLog = document.getElementById('sys-log');
      const logs = [
        { m: 'Scanning access point...', c: 'warn' },
        { m: 'ICE level 3 détecté sur le noeud', c: 'err' },
        { m: 'Breach Protocol activé buffer alloué', c: 'ok' },
        { m: 'Connexion au sous-réseau local', c: 'ok' },
        { m: 'Déchiffrement du code matrix en cours', c: 'sys' },
        { m: 'DATAMINE_V1 uploadé avec succès', c: 'ok' },
        { m: 'DATAMINE_V2 uploadé avec succès', c: 'ok' },
        { m: 'ICEPICK installé coût RAM réduit', c: 'ok' },
        { m: 'MASS VULNERABILITY séquence invalide', c: 'err' },
        { m: 'ALERTE: NetWatch détecté à proximité', c: 'err' },
        { m: 'Nettoyage des traces réseau...', c: 'sys' },
        { m: 'Déconnexion du sous-réseau imminente', c: 'warn' },
      ];
      let logIdx = 0;

      const logTimer = setInterval(() => {
        if (logIdx >= logs.length) { clearInterval(logTimer); return; }
        const l = logs[logIdx];
        const ts = new Date().toTimeString().slice(0, 8);
        const line = document.createElement('div');
        line.className = 'log-entry';
        line.innerHTML = `<span class="t">[${ts}]</span> <span class="${l.c}">${l.m}</span>`;
        sysLog.appendChild(line);
        sysLog.scrollTop = sysLog.scrollHeight;
        logIdx++;
      }, 900);

      // ── Timer bar ──
      const timerFill = document.getElementById('timer-fill');
      const timerVal = document.getElementById('timer-val');
      let timerWidth = 100;
      const timerStep = 100 / (TOTAL_TIME * 10);

      const timerInterval = setInterval(() => {
        timerWidth -= timerStep;
        if (timerWidth <= 0) timerWidth = 0;
        timerFill.style.width = timerWidth + '%';
        timerVal.textContent = (timerWidth / 10).toFixed(1) + 's';
      }, 100);

      // ── ICE / RAM status ──
      const iceVal = document.getElementById('ice-val');
      const ramVal = document.getElementById('ram-val');
      let ram = 12;

      setTimeout(() => { iceVal.textContent = 'DETECTED'; iceVal.style.color = 'var(--red)'; }, 1500);
      setTimeout(() => { iceVal.textContent = 'BYPASSED'; iceVal.style.color = 'var(--cyan)'; }, 4000);

      setInterval(() => {
        if (ram > 4) { ram -= 2; ramVal.textContent = ram; }
        if (ram <= 6) ramVal.style.color = 'var(--red)';
      }, 2500);

      // ── Countdown + redirect ──
      const countdownEl = document.getElementById('countdown');
      const cdInterval = setInterval(() => {
        countdown--;
        if (countdown <= 0) {
          countdownEl.textContent = '>>>';
          clearInterval(cdInterval);
          clearInterval(timerInterval);
          timerFill.style.width = '0%';
          timerVal.textContent = '0.0s';
          setTimeout(() => { window.location.href = redirectUrl; }, 400);
        } else {
          countdownEl.textContent = countdown;
        }
      }, 1000);
    });
  </script>
</body>
</html>
