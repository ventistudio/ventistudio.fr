<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
  <meta name="description" content="VentiStudio - Redirection d'urgence en cours.">
  <meta name="theme-color" content="#6366f1">
  <title>Redirection | VentiStudio</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .redirect-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .redirect-icon {
      font-size: 4rem;
      animation: pulse-redirect 1.5s ease-in-out infinite;
      margin-bottom: 1.5rem;
      display: block;
    }
    @keyframes pulse-redirect {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.15); opacity: .7; }
    }
    .redirect-container h1 {
      font-size: 1.8rem;
      margin-bottom: .5rem;
      color: #ef4444;
    }
    .redirect-container .desc {
      font-size: 1rem;
      opacity: .7;
      max-width: 500px;
      margin: 0 auto 2rem;
      line-height: 1.6;
    }
    .countdown-bar {
      width: 300px;
      max-width: 100%;
      height: 6px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 1rem;
    }
    .countdown-bar .bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #ef4444);
      border-radius: 10px;
      animation: countdown-shrink 3s linear forwards;
    }
    @keyframes countdown-shrink {
      0% { width: 100%; }
      100% { width: 0%; }
    }
    .countdown-text {
      font-size: .9rem;
      opacity: .5;
      margin-bottom: 1.5rem;
    }
    .redirect-manual a {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      padding: .7rem 1.8rem;
      background: var(--accent);
      color: #fff;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      transition: background .2s, transform .2s;
    }
    .redirect-manual a:hover {
      background: var(--accent-secondary);
      transform: translateY(-2px);
    }
  </style>

  <script async crossorigin="anonymous" src="https://clerk.ventistudio.eu/npm/@clerk/ui@1/dist/ui.browser.js" type="text/javascript"></script>
  <script async crossorigin="anonymous" data-clerk-publishable-key="pk_live_Y2xlcmsudmVudGlzdHVkaW8uZXUk" src="https://clerk.ventistudio.eu/npm/@clerk/clerk-js@6/dist/clerk.browser.js" type="text/javascript"></script>

  <meta property="og:title" content="Redirection | VentiStudio">
  <meta property="og:description" content="VentiStudio - Redirection d'urgence en cours.">
  <meta property="og:url" content="https://ventistudio.eu/social/">
  <meta property="og:image" content="https://ventistudio.eu/favicon.avif">
  <meta property="og:type" content="website">
  <link rel="canonical" href="https://ventistudio.eu/social/">
  <script src="/i18n.js" defer></script>
</head>
<body>
  <div class="redirect-container">
    <span class="redirect-icon" aria-hidden="true">⚠️</span>
    <h1>Redirection d'urgence</h1>
    <p class="desc">Une erreur critique s'est produite. Pour votre sécurité, vous allez être redirigé automatiquement vers la page d'accueil.</p>
    <div class="countdown-bar">
      <div class="bar-fill"></div>
    </div>
    <p class="countdown-text">Redirection dans <span id="countdown">3</span> secondes…</p>
    <div class="redirect-manual">
      <a href="/">Redirection immédiate</a>
    </div>
  </div>

  <script>
    let seconds = 3;
    const countdownEl = document.getElementById('countdown');
    const timer = setInterval(() => {
      seconds--;
      if (countdownEl) countdownEl.textContent = seconds;
      if (seconds <= 0) {
        clearInterval(timer);
        window.location.href = '/';
      }
    }, 1000);
  </script>
</body>
</html>
