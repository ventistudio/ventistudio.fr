<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Réseaux sociaux de FiTsZ - VentiStudio.">
  <meta name="theme-color" content="#6366f1">
  <title>Social | VentiStudio</title>
  <style>
    :root {
      --primary: #7B66FF;
      --secondary: #2A2D3A;
      --background: #1A1B26;
      --text: #FFFFFF;
      --hover: #9F86FF;
      --orbit-blue: #4A90E2;
    }
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--background);
      font-family: 'Inter', sans-serif;
      color: var(--text);
      overflow: hidden;
    }
    .redirect-container {
      text-align: center;
      padding: 2rem;
      position: relative;
      z-index: 2;
    }
    .logo {
      width: 150px;
      margin-bottom: 2rem;
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(5deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    .redirect-text {
      font-size: 1.5rem;
      margin-bottom: 1rem;
      text-shadow: 0 0 10px var(--orbit-blue);
    }
    .loader {
      width: 80px;
      height: 80px;
      margin: 1rem auto;
      position: relative;
    }
    .orbit {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 2px solid var(--orbit-blue);
      border-radius: 50%;
      animation: orbit 2s linear infinite;
    }
    .orbit::after {
      content: '';
      position: absolute;
      width: 10px;
      height: 10px;
      background: var(--primary);
      border-radius: 50%;
      top: -5px;
      left: 50%;
      box-shadow: 0 0 10px var(--primary);
    }
    .orbit:nth-child(2) {
      width: 60px; height: 60px;
      margin: 10px;
      animation-duration: 3s;
      animation-direction: reverse;
    }
    .orbit:nth-child(3) {
      width: 40px; height: 40px;
      margin: 20px;
      animation-duration: 1.5s;
    }
    @keyframes orbit {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .countdown {
      font-size: 1.2rem;
      color: var(--primary);
      text-shadow: 0 0 5px var(--primary);
    }
    .stars {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 1;
    }
    .star {
      position: absolute;
      width: 2px; height: 2px;
      background: white;
      border-radius: 50%;
      animation: twinkle var(--duration) linear infinite;
      opacity: var(--opacity);
    }
    @keyframes twinkle {
      0%, 100% { opacity: var(--opacity); }
      50% { opacity: 0.2; }
    }
  </style>

  <script async crossorigin="anonymous" src="https://clerk.ventistudio.eu/npm/@clerk/ui@1/dist/ui.browser.js" type="text/javascript"></script>
  <script async crossorigin="anonymous" data-clerk-publishable-key="pk_live_Y2xlcmsudmVudGlzdHVkaW8uZXUk" src="https://clerk.ventistudio.eu/npm/@clerk/clerk-js@6/dist/clerk.browser.js" type="text/javascript"></script>

  <meta property="og:title" content="Social | VentiStudio">
  <meta property="og:description" content="Réseaux sociaux de FiTsZ - VentiStudio.">
  <meta property="og:url" content="https://ventistudio.eu/social/FiTsZ/">
  <meta property="og:image" content="https://ventistudio.eu/favicon.avif">
  <meta property="og:type" content="website">
  <link rel="canonical" href="https://ventistudio.eu/social/FiTsZ/">
</head>
<body>
  <div class="stars" id="starField"></div>
  <div class="redirect-container">
    <img src="/favicon.avif" alt="VentiStudio Logo" class="logo">
    <div class="redirect-text">Initialisation du transfert spatial...</div>
    <div class="loader">
      <div class="orbit"></div>
      <div class="orbit"></div>
      <div class="orbit"></div>
    </div>
    <div class="countdown">Téléportation dans <span id="timer">5</span> secondes</div>
  </div>

  <script>
    const starField = document.getElementById('starField');
    for (let i = 0; i < 100; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      star.style.left = `${Math.random() * 100}%`;
      star.style.top = `${Math.random() * 100}%`;
      star.style.setProperty('--duration', `${2 + Math.random() * 3}s`);
      star.style.setProperty('--opacity', `${0.5 + Math.random() * 0.5}`);
      starField.appendChild(star);
    }

    function getRedirectUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('redirect');
    }

    let timeLeft = 5;
    const timerElement = document.getElementById('timer');
    const redirectUrl = getRedirectUrl();

    if (redirectUrl) {
      const countdown = setInterval(() => {
        timeLeft--;
        timerElement.textContent = timeLeft;
        if (timeLeft <= 0) {
          clearInterval(countdown);
          window.location.href = redirectUrl;
        }
      }, 1000);
    } else {
      document.querySelector('.redirect-text').textContent = 'Erreur de coordonnées spatiales';
      document.querySelector('.loader').style.display = 'none';
      document.querySelector('.countdown').style.display = 'none';
    }
  </script>
</body>
</html>
