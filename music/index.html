<!DOCTYPE html>

<html data-theme="dark" lang="fr">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, shrink-to-fit=no" name="viewport"/>
<meta content="VentiStudio Music – Écoutez toute la discographie VentiStudio." name="description"/>
<meta content="#6366f1" name="theme-color"/>
<title>VentiStudio Music</title>
<link href="styles.css" rel="stylesheet"/>
<script async="" crossorigin="anonymous" src="https://clerk.ventistudio.eu/npm/@clerk/ui@1/dist/ui.browser.js" type="text/javascript"></script>
<script async="" crossorigin="anonymous" data-clerk-publishable-key="pk_live_Y2xlcmsudmVudGlzdHVkaW8uZXUk" src="https://clerk.ventistudio.eu/npm/@clerk/clerk-js@6/dist/clerk.browser.js" type="text/javascript"></script>
<meta content="VentiStudio Music" property="og:title"/>
<meta content="VentiStudio Music – Écoutez toute la discographie VentiStudio." property="og:description"/>
<meta content="https://ventistudio.eu/music/" property="og:url"/>
<meta content="https://ventistudio.eu/favicon.avif" property="og:image"/>
<meta content="website" property="og:type"/>
<link href="https://ventistudio.eu/music/" rel="canonical"/>
<script defer="" src="/i18n.js"></script>
</head>
<body>

<aside class="sidebar" id="sidebar">
<div class="sidebar-logo">
<img alt="VentiStudio" height="32" src="../favicon.avif" width="32"/>
<span>VentiStudio Music</span>
</div>
<nav class="sidebar-nav">
<a class="nav-item active" href="/music">
<svg fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
<span>Accueil</span>
</a>
<a class="nav-item" href="/music/history">
<svg fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="24"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
<span>Historique</span>
</a>
<a class="nav-item" href="javascript:void(0)" id="navArtists" onclick="showView('artists')">
<svg fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
<span>Artistes</span>
</a>
<a class="nav-item" href="javascript:void(0)" id="navAlbums" onclick="showView('albums')">
<svg fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="24"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="3"></circle></svg>
<span>Albums</span>
</a>
<div class="sidebar-divider"></div>
<a class="nav-item" href="/">
<svg fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="24"><circle cx="12" cy="12" r="10"></circle><line x1="2" x2="22" y1="12" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
<span>Site VentiStudio</span>
</a>
</nav>
</aside>

<main class="main-content" id="mainContent">

<div class="topbar">
<button aria-label="Menu" class="sidebar-toggle" data-i18n-attr="aria-label:music.topbar.aria" id="sidebarToggle">
<svg fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="24"><line x1="3" x2="21" y1="12" y2="12"></line><line x1="3" x2="21" y1="6" y2="6"></line><line x1="3" x2="21" y1="18" y2="18"></line></svg>
</button>
<div class="search-bar">
<svg class="search-icon" fill="none" height="20" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="20"><circle cx="11" cy="11" r="8"></circle><line x1="21" x2="16.65" y1="21" y2="16.65"></line></svg>
<input data-i18n-attr="placeholder:music.topbar_search_bar.input_placeholder" id="searchInput" placeholder="Rechercher un titre, artiste, album…" type="text"/>
</div>
<div class="sort-select" id="sortSelectWrap">
<select id="sortSelect">
<option value="">Trier par…</option>
<option value="title">Titre</option>
<option value="artist">Artiste</option>
<option value="album">Album</option>
</select>
</div>
<button class="topbar-back" id="backBtn" onclick="showView('home')" style="display:none" title="Retour">
<svg fill="none" height="22" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="22"><line x1="19" x2="5" y1="12" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
</button>
</div>

<div id="viewContainer"></div>
</main>

<div class="player" id="playerBar">
<div class="player-left">
<div class="player-album-art" id="albumArt">
<img alt="Cover" id="currentAlbumImage" src="../favicon.avif"/>
</div>
<div class="player-track-info">
<p class="player-track-title" id="nowPlayingTitle">Aucune musique</p>
<p class="player-track-artist" id="nowPlayingArtist"></p>
</div>
</div>
<div class="player-center">
<div class="player-buttons">
<button class="ctrl-btn" id="shuffleBtn" onclick="toggleShuffle()" title="Aléatoire">
<svg fill="none" height="18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="18"><path d="M16 3h5v5"></path><path d="M4 20L21 3"></path><path d="M21 16v5h-5"></path><path d="M15 15l6 6"></path><path d="M4 4l5 5"></path></svg>
</button>
<button class="ctrl-btn" onclick="prevTrack()" title="Précédent">
<svg fill="none" height="20" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="20"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" x2="5" y1="19" y2="5"></line></svg>
</button>
<button class="ctrl-btn ctrl-play" id="playPauseBtn" onclick="togglePlay()" title="Lecture">
<svg fill="none" height="22" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="22"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
</button>
<button class="ctrl-btn" onclick="nextTrack()" title="Suivant">
<svg fill="none" height="20" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="20"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" x2="19" y1="5" y2="19"></line></svg>
</button>
<button class="ctrl-btn" id="loopBtn" onclick="toggleLoop()" title="Répéter">
<svg fill="none" height="18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="18"><path d="M17 2l4 4-4 4"></path><path d="M3 11v-1a4 4 0 0 1 4-4h14"></path><path d="M7 22l-4-4 4-4"></path><path d="M21 13v1a4 4 0 0 1-4 4H3"></path></svg>
</button>
</div>
<div class="player-progress">
<span class="time" id="currentTime">0:00</span>
<div class="progress-wrapper" id="progressWrapper">
<div class="progress-bar" id="progressBar"></div>
<div class="progress-handle" id="progressHandle"></div>
</div>
<span class="time" id="totalTime">0:00</span>
</div>
</div>
<div class="player-right">
<button class="ctrl-btn" onclick="shareTrack()" title="Partager">
<svg fill="none" height="18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="18"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" x2="15.42" y1="13.51" y2="17.49"></line><line x1="15.41" x2="8.59" y1="6.51" y2="10.49"></line></svg>
</button>
<button class="ctrl-btn" onclick="enterFullscreenLed()" title="Plein écran LED">
<svg fill="none" height="18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="18"><path d="M8 3H5a2 2 0 0 0-2 2v3"></path><path d="M21 8V5a2 2 0 0 0-2-2h-3"></path><path d="M3 16v3a2 2 0 0 0 2 2h3"></path><path d="M16 21h3a2 2 0 0 0 2-2v-3"></path></svg>
</button>
<div class="volume-control">
<button class="ctrl-btn volume-btn" id="volumeToggle" title="Volume">
<svg fill="none" height="18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="18"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
</button>
<input id="volumeSlider" max="1" min="0" step="0.01" type="range" value="0.8"/>
</div>
</div>
</div>

<div class="player-mobile" id="playerMobile">
<div class="pm-info">
<img alt="Cover" class="pm-cover" id="pmCover" src="../favicon.avif"/>
<div class="pm-text">
<p class="pm-title" id="pmTitle">Aucune musique</p>
<p class="pm-artist" id="pmArtist"></p>
</div>
</div>
<div class="pm-controls">
<button class="ctrl-btn" id="pmPlayBtn" onclick="togglePlay()">
<svg fill="none" height="24" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" width="24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
</button>
<button class="ctrl-btn" onclick="nextTrack()">
<svg fill="none" height="20" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" width="20"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" x2="19" y1="5" y2="19"></line></svg>
</button>
</div>
<div class="pm-progress">
<div class="pm-progress-bar" id="pmProgressBar"></div>
</div>
</div>

<div id="fullscreenLed">
<canvas class="led-canvas"></canvas>
<div class="led-content">
<img alt="Album cover" class="led-album" src=""/>
<div class="led-title"></div>
<div class="led-artist"></div>
<button class="led-exit" onclick="exitFullscreenLed()">Quitter le plein écran</button>
</div>
</div>

<div class="sidebar-overlay" id="sidebarOverlay"></div>
<audio id="mainAudio"></audio>
<script defer="" src="app.js"></script>
<script defer src="/antibot.js"></script>
</body>
</html>
