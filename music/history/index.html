<style>
    /* History-specific overrides */
    .history-header {
      padding: 2rem 1.5rem 1rem;
      background: linear-gradient(180deg, rgba(99, 102, 241, 0.12) 0%, transparent 100%);
    }

    .history-header h1 {
      font-size: 2rem;
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 0.4rem;
    }

    .history-header p {
      font-size: 0.95rem;
      color: var(--text-secondary);
    }

    .history-actions {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.75rem 1.5rem;
    }

    .btn-clear {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.6rem 1.25rem;
      border-radius: 500px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      font-size: 0.85rem;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-clear:hover {
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.3);
      color: #ef4444;
    }

    .history-count {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* History list table-like rows */
    .history-list {
      display: flex;
      flex-direction: column;
      padding: 0 1.5rem 8rem;
    }

    .history-item {
      display: grid;
      grid-template-columns: 48px 1fr auto;
      align-items: center;
      gap: 1rem;
      padding: 0.6rem 0.75rem;
      border-radius: var(--radius);
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .history-item:hover {
      background: var(--bg-highlight);
    }

    .history-item img {
      width: 48px;
      height: 48px;
      border-radius: 6px;
      object-fit: cover;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
    }

    .history-item-info {
      min-width: 0;
    }

    .history-item-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-item-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 0.15rem;
    }

    .history-item-plays {
      font-size: 0.8rem;
      color: var(--text-muted);
      white-space: nowrap;
      padding-right: 0.5rem;
    }

    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
    }

    .empty-state svg {
      color: var(--text-muted);
      opacity: 0.4;
      margin-bottom: 1rem;
    }

    .empty-state h2 {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 0.5rem;
    }

    .empty-state p {
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .empty-state .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 1.5rem;
      padding: 0.7rem 1.5rem;
      border-radius: 500px;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }

    .empty-state .btn-back:hover {
      transform: scale(1.03);
      box-shadow: 0 4px 16px var(--accent-glow);
    }

    @media (max-width: 768px) {
      .history-header {
        padding: 1.5rem 1rem 0.75rem;
      }
      .history-header h1 {
        font-size: 1.5rem;
      }
      .history-actions {
        padding: 0.5rem 1rem;
      }
      .history-list {
        padding: 0 1rem 6rem;
      }
      .history-item {
        grid-template-columns: 40px 1fr auto;
        gap: 0.75rem;
        padding: 0.5rem;
      }
      .history-item img {
        width: 40px;
        height: 40px;
      }
    }
  </style>

<script>
    // --- Render History ---
    function renderHistory(filter = '') {
      const list = document.getElementById('historyList');
      const countEl = document.getElementById('historyCount');
      let history = JSON.parse(localStorage.getItem('musicHistory') || '[]');

      if (filter) {
        const q = filter.toLowerCase();
        history = history.filter(t =>
          `${t.title} ${t.artist} ${t.album}`.toLowerCase().includes(q)
        );
      }

      if (countEl) {
        countEl.textContent = history.length > 0 ? `${history.length} titre${history.length > 1 ? 's' : ''}` : '';
      }

      if (!history.length) {
        list.innerHTML = `
          <div class="empty-state">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <h2>Aucun historique</h2>
            <p>Écoutez de la musique pour voir votre historique apparaître ici.</p>
            <a href="/music" class="btn-back">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
              Explorer la musique
            </a>
          </div>
        `;
        return;
      }

      list.innerHTML = '';
      history.forEach((track, idx) => {
        const item = document.createElement('div');
        item.className = 'history-item';
        item.onclick = () => {
          // Play inline using the embedded player
          if (typeof musicData !== 'undefined' && musicData.length > 0) {
            const trackIdx = musicData.findIndex(t => t.title === track.title && t.artist === track.artist);
            if (trackIdx !== -1) {
              playTrack(trackIdx);
              return;
            }
          }
          // Fallback: navigate to main player
          window.location.href = `/music?track=${encodeURIComponent(track.title)}`;
        };
        item.innerHTML = `
          <img src="/${track.cover}" alt="${track.title}" loading="lazy">
          <div class="history-item-info">
            <div class="history-item-title">${track.title}</div>
            <div class="history-item-meta">${track.artist} · ${track.album || 'Single'}</div>
          </div>
          <div class="history-item-plays">${track.playCount || 1}×</div>
        `;
        list.appendChild(item);
      });
    }

    // --- Clear History ---
    function clearHistory() {
      if (!confirm('Voulez-vous vraiment effacer tout l\'historique d\'écoute ?')) return;
      localStorage.removeItem('musicHistory');
      renderHistory();
    }

    // --- Search ---
    document.getElementById('historySearch')?.addEventListener('input', e => {
      renderHistory(e.target.value);
    });

    // --- Init ---
    renderHistory();
  </script>
