<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
  <meta name="description" content="VentiStudio Music – Votre historique d'écoute.">
  <meta name="theme-color" content="#6366f1">
  <title>Historique — VentiStudio Music</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    /* History-specific overrides */
    .history-header {
      padding: 2rem 1.5rem 1rem;
      background: linear-gradient(180deg, rgba(99, 102, 241, 0.12) 0%, transparent 100%);
    }

    .history-header h1 {
      font-size: 2rem;
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 0.4rem;
    }

    .history-header p {
      font-size: 0.95rem;
      color: var(--text-secondary);
    }

    .history-actions {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.75rem 1.5rem;
    }

    .btn-clear {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.6rem 1.25rem;
      border-radius: 500px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      font-size: 0.85rem;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-clear:hover {
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.3);
      color: #ef4444;
    }

    .history-count {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* History list — table-like rows */
    .history-list {
      display: flex;
      flex-direction: column;
      padding: 0 1.5rem 8rem;
    }

    .history-item {
      display: grid;
      grid-template-columns: 48px 1fr auto;
      align-items: center;
      gap: 1rem;
      padding: 0.6rem 0.75rem;
      border-radius: var(--radius);
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .history-item:hover {
      background: var(--bg-highlight);
    }

    .history-item img {
      width: 48px;
      height: 48px;
      border-radius: 6px;
      object-fit: cover;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
    }

    .history-item-info {
      min-width: 0;
    }

    .history-item-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-item-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 0.15rem;
    }

    .history-item-plays {
      font-size: 0.8rem;
      color: var(--text-muted);
      white-space: nowrap;
      padding-right: 0.5rem;
    }

    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
    }

    .empty-state svg {
      color: var(--text-muted);
      opacity: 0.4;
      margin-bottom: 1rem;
    }

    .empty-state h2 {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 0.5rem;
    }

    .empty-state p {
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .empty-state .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 1.5rem;
      padding: 0.7rem 1.5rem;
      border-radius: 500px;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }

    .empty-state .btn-back:hover {
      transform: scale(1.03);
      box-shadow: 0 4px 16px var(--accent-glow);
    }

    @media (max-width: 768px) {
      .history-header {
        padding: 1.5rem 1rem 0.75rem;
      }
      .history-header h1 {
        font-size: 1.5rem;
      }
      .history-actions {
        padding: 0.5rem 1rem;
      }
      .history-list {
        padding: 0 1rem 6rem;
      }
      .history-item {
        grid-template-columns: 40px 1fr auto;
        gap: 0.75rem;
        padding: 0.5rem;
      }
      .history-item img {
        width: 40px;
        height: 40px;
      }
    }
  </style>
</head>
<body>

  <!-- Sidebar (same as main music page) -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <img src="../../favicon.avif" alt="VentiStudio" width="32" height="32">
      <span>VentiStudio Music</span>
    </div>
    <nav class="sidebar-nav">
      <a href="/music" class="nav-item">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>Accueil</span>
      </a>
      <a href="/music/history" class="nav-item active">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span>Historique</span>
      </a>
      <a href="/music?view=artists" class="nav-item">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>Artistes</span>
      </a>
      <a href="/music?view=albums" class="nav-item">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        <span>Albums</span>
      </a>
      <div class="sidebar-divider"></div>
      <a href="/" class="nav-item">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        <span>Site VentiStudio</span>
      </a>
    </nav>
  </aside>

  <!-- Main Content -->
  <main class="main-content">

    <!-- Top Bar -->
    <div class="topbar">
      <button class="sidebar-toggle" id="sidebarToggle" aria-label="Menu">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="search-bar">
        <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="historySearch" placeholder="Rechercher dans l'historique…">
      </div>
    </div>

    <!-- History Header -->
    <div class="history-header">
      <h1>Historique</h1>
      <p>Vos morceaux récemment écoutés</p>
    </div>

    <div class="history-actions">
      <button class="btn-clear" id="clearBtn" onclick="clearHistory()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        Effacer l'historique
      </button>
      <span class="history-count" id="historyCount"></span>
    </div>

    <!-- History List -->
    <div class="history-list" id="historyList"></div>

  </main>

  <!-- Bottom Player -->
  <div class="player" id="playerBar">
    <div class="player-left">
      <div class="player-album-art" id="albumArt">
        <img id="currentAlbumImage" src="../../favicon.avif" alt="Cover">
      </div>
      <div class="player-track-info">
        <p class="player-track-title" id="nowPlayingTitle">Aucune musique</p>
        <p class="player-track-artist" id="nowPlayingArtist">—</p>
      </div>
    </div>
    <div class="player-center">
      <div class="player-buttons">
        <button class="ctrl-btn" id="shuffleBtn" title="Aléatoire" onclick="toggleShuffle()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 20L21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg>
        </button>
        <button class="ctrl-btn" title="Précédent" onclick="prevTrack()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg>
        </button>
        <button class="ctrl-btn ctrl-play" id="playPauseBtn" title="Lecture" onclick="togglePlay()">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        </button>
        <button class="ctrl-btn" title="Suivant" onclick="nextTrack()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
        </button>
        <button class="ctrl-btn" id="loopBtn" title="Répéter" onclick="toggleLoop()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>
        </button>
      </div>
      <div class="player-progress">
        <span class="time" id="currentTime">0:00</span>
        <div class="progress-wrapper" id="progressWrapper">
          <div class="progress-bar" id="progressBar"></div>
          <div class="progress-handle" id="progressHandle"></div>
        </div>
        <span class="time" id="totalTime">0:00</span>
      </div>
    </div>
    <div class="player-right">
      <button class="ctrl-btn" title="Partager" onclick="shareTrack()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
      </button>
      <button class="ctrl-btn" title="Plein écran LED" onclick="enterFullscreenLed()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
      </button>
      <div class="volume-control">
        <button class="ctrl-btn volume-btn" id="volumeToggle" title="Volume">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
        </button>
        <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.8">
      </div>
    </div>
  </div>

  <!-- Mobile Player (compact) -->
  <div class="player-mobile" id="playerMobile">
    <div class="pm-info">
      <img class="pm-cover" id="pmCover" src="../../favicon.avif" alt="Cover">
      <div class="pm-text">
        <p class="pm-title" id="pmTitle">Aucune musique</p>
        <p class="pm-artist" id="pmArtist">—</p>
      </div>
    </div>
    <div class="pm-controls">
      <button class="ctrl-btn" onclick="togglePlay()" id="pmPlayBtn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      </button>
      <button class="ctrl-btn" onclick="nextTrack()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
      </button>
    </div>
    <div class="pm-progress">
      <div class="pm-progress-bar" id="pmProgressBar"></div>
    </div>
  </div>

  <!-- LED Fullscreen -->
  <div id="fullscreenLed">
    <canvas class="led-canvas"></canvas>
    <div class="led-content">
      <img class="led-album" src="" alt="Album cover">
      <div class="led-title"></div>
      <div class="led-artist"></div>
      <button class="led-exit" onclick="exitFullscreenLed()">Quitter le plein écran</button>
    </div>
  </div>

  <!-- Sidebar Overlay (mobile) -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <audio id="mainAudio"></audio>
  <script src="../app.js" defer></script>

  <script>
    // --- Render History ---
    function renderHistory(filter = '') {
      const list = document.getElementById('historyList');
      const countEl = document.getElementById('historyCount');
      let history = JSON.parse(localStorage.getItem('musicHistory') || '[]');

      if (filter) {
        const q = filter.toLowerCase();
        history = history.filter(t =>
          `${t.title} ${t.artist} ${t.album}`.toLowerCase().includes(q)
        );
      }

      if (countEl) {
        countEl.textContent = history.length > 0 ? `${history.length} titre${history.length > 1 ? 's' : ''}` : '';
      }

      if (!history.length) {
        list.innerHTML = `
          <div class="empty-state">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <h2>Aucun historique</h2>
            <p>Écoutez de la musique pour voir votre historique apparaître ici.</p>
            <a href="/music" class="btn-back">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
              Explorer la musique
            </a>
          </div>
        `;
        return;
      }

      list.innerHTML = '';
      history.forEach((track, idx) => {
        const item = document.createElement('div');
        item.className = 'history-item';
        item.onclick = () => {
          // Play inline using the embedded player
          if (typeof musicData !== 'undefined' && musicData.length > 0) {
            const trackIdx = musicData.findIndex(t => t.title === track.title && t.artist === track.artist);
            if (trackIdx !== -1) {
              playTrack(trackIdx);
              return;
            }
          }
          // Fallback: navigate to main player
          window.location.href = `/music?track=${encodeURIComponent(track.title)}`;
        };
        item.innerHTML = `
          <img src="/${track.cover}" alt="${track.title}" loading="lazy">
          <div class="history-item-info">
            <div class="history-item-title">${track.title}</div>
            <div class="history-item-meta">${track.artist} · ${track.album || 'Single'}</div>
          </div>
          <div class="history-item-plays">${track.playCount || 1}×</div>
        `;
        list.appendChild(item);
      });
    }

    // --- Clear History ---
    function clearHistory() {
      if (!confirm('Voulez-vous vraiment effacer tout l\'historique d\'écoute ?')) return;
      localStorage.removeItem('musicHistory');
      renderHistory();
    }

    // --- Search ---
    document.getElementById('historySearch')?.addEventListener('input', e => {
      renderHistory(e.target.value);
    });

    // --- Init ---
    renderHistory();
  </script>
</body>
</html>
