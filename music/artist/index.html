<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
  <meta name="description" content="VentiStudio Music Page artiste">
  <meta name="theme-color" content="#6366f1">
  <title>Artiste | VentiStudio Music</title>
  <link rel="stylesheet" href="../styles.css">

  <script async crossorigin="anonymous" src="https://clerk.ventistudio.eu/npm/@clerk/ui@1/dist/ui.browser.js" type="text/javascript"></script>
  <script async crossorigin="anonymous" data-clerk-publishable-key="pk_live_Y2xlcmsudmVudGlzdHVkaW8uZXUk" src="https://clerk.ventistudio.eu/npm/@clerk/clerk-js@6/dist/clerk.browser.js" type="text/javascript"></script>

  <meta property="og:title" content="Artiste | VentiStudio Music">
  <meta property="og:description" content="VentiStudio Music Page artiste">
  <meta property="og:url" content="https://ventistudio.eu/music/artist/">
  <meta property="og:image" content="https://ventistudio.eu/favicon.avif">
  <meta property="og:type" content="website">
  <link rel="canonical" href="https://ventistudio.eu/music/artist/">
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <img src="../../favicon.avif" alt="VentiStudio" width="32" height="32">
      <span>VentiStudio Music</span>
    </div>
    <nav class="sidebar-nav">
      <a href="/music" class="nav-item">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>Accueil</span>
      </a>
      <a href="/music/history" class="nav-item">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span>Historique</span>
      </a>
      <a href="javascript:void(0)" class="nav-item active" id="navArtists">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span>Artistes</span>
      </a>
      <a href="javascript:void(0)" class="nav-item" id="navAlbums">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg>
        <span>Albums</span>
      </a>
      <div class="sidebar-divider"></div>
      <a href="/" class="nav-item">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        <span>Site VentiStudio</span>
      </a>
    </nav>
  </aside>

  <!-- Main Content -->
  <main class="main-content" id="mainContent">
    <div class="topbar">
      <button class="sidebar-toggle" id="sidebarToggle" aria-label="Menu">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <button class="topbar-back" onclick="window.location.href='/music'" title="Retour">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      </button>
      <div class="search-bar">
        <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="artistSearch" placeholder="Rechercher dans les titres…">
      </div>
    </div>
    <div id="artistContent">
      <div class="empty-state">
        <p>Chargement…</p>
      </div>
    </div>
  </main>

  <!-- Player (mini - no audio on standalone artist page, link to main player) -->
  <div class="player" id="playerBar">
    <div class="player-left">
      <div class="player-album-art"><img id="currentAlbumImage" src="../../favicon.avif" alt="Cover"></div>
      <div class="player-track-info">
        <p class="player-track-title" id="nowPlayingTitle">Aucune musique</p>
        <p class="player-track-artist" id="nowPlayingArtist">—</p>
      </div>
    </div>
    <div class="player-center">
      <div class="player-buttons">
        <button class="ctrl-btn" id="shuffleBtn" onclick="toggleShuffle()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3h5v5"/><path d="M4 20L21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg></button>
        <button class="ctrl-btn" onclick="prevTrack()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg></button>
        <button class="ctrl-btn ctrl-play" id="playPauseBtn" onclick="togglePlay()"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg></button>
        <button class="ctrl-btn" onclick="nextTrack()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg></button>
        <button class="ctrl-btn" id="loopBtn" onclick="toggleLoop()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 2l4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg></button>
      </div>
      <div class="player-progress">
        <span class="time" id="currentTime">0:00</span>
        <div class="progress-wrapper" id="progressWrapper">
          <div class="progress-bar" id="progressBar"></div>
          <div class="progress-handle" id="progressHandle"></div>
        </div>
        <span class="time" id="totalTime">0:00</span>
      </div>
    </div>
    <div class="player-right">
      <div class="volume-control">
        <button class="ctrl-btn volume-btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg></button>
        <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.8">
      </div>
    </div>
  </div>

  <!-- Mobile Player -->
  <div class="player-mobile" id="playerMobile">
    <div class="pm-info">
      <img class="pm-cover" id="pmCover" src="../../favicon.avif" alt="Cover">
      <div class="pm-text">
        <p class="pm-title" id="pmTitle">Aucune musique</p>
        <p class="pm-artist" id="pmArtist">—</p>
      </div>
    </div>
    <div class="pm-controls">
      <button class="ctrl-btn" onclick="togglePlay()" id="pmPlayBtn"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg></button>
      <button class="ctrl-btn" onclick="nextTrack()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg></button>
    </div>
    <div class="pm-progress"><div class="pm-progress-bar" id="pmProgressBar"></div></div>
  </div>

  <!-- LED Fullscreen -->
  <div id="fullscreenLed">
    <canvas class="led-canvas"></canvas>
    <div class="led-content">
      <img class="led-album" src="" alt="Album cover">
      <div class="led-title"></div>
      <div class="led-artist"></div>
      <button class="led-exit" onclick="exitFullscreenLed()">Quitter le plein écran</button>
    </div>
  </div>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <audio id="mainAudio"></audio>

  <script>
    // This page redirects to the main player with the artist param
    // The main player handles all the views
    const params = new URLSearchParams(window.location.search);
    const artistName = params.get('name');
    if (artistName) {
      window.location.href = `/music?artist=${encodeURIComponent(artistName)}`;
    } else {
      window.location.href = '/music';
    }
  </script>
</body>
</html>
