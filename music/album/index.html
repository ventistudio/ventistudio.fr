<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">

  <meta name="theme-color" content="#6366f1">

  <script async crossorigin="anonymous" src="https://clerk.ventistudio.eu/npm/@clerk/ui@1/dist/ui.browser.js" type="text/javascript"></script>
  <script async crossorigin="anonymous" data-clerk-publishable-key="pk_live_Y2xlcmsudmVudGlzdHVkaW8uZXUk" src="https://clerk.ventistudio.eu/npm/@clerk/clerk-js@6/dist/clerk.browser.js" type="text/javascript"></script>

  <meta property="og:title" content="Album | VentiStudio Music">
  <meta property="og:description" content="VentiStudio Music Page album">
  <meta property="og:url" content="https://ventistudio.eu/music/album/">
  <meta property="og:image" content="https://ventistudio.eu/favicon.avif">
  <meta property="og:type" content="website">
  <link rel="canonical" href="https://ventistudio.eu/music/album/">
  <script src="/i18n.js" defer></script>
</head>
<body>
  <script>
    // Redirect to the main player with album param
    const params = new URLSearchParams(window.location.search);
    const albumName = params.get('name');
    const artistName = params.get('artist');
    if (albumName && artistName) {
      window.location.href = `/music?album=${encodeURIComponent(albumName + '___' + artistName)}`;
    } else if (albumName) {
      window.location.href = `/music?album=${encodeURIComponent(albumName)}`;
    } else {
      window.location.href = '/music';
    }
  </script>
</body>
</html>
