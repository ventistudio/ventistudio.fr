<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
  <meta name="description" content="VentiStudio - Accès refusé. Le site est actuellement fermé ou inaccessible.">
  <meta name="theme-color" content="#6366f1">
  <title>Accès Refusé | VentiStudio</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .warning-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      text-align: center;
      padding: 2rem;
    }

    .warning-icon {
      font-size: 4rem;
      display: block;
      margin-bottom: 1.5rem;
      animation: shake-warning 3s ease-in-out infinite;
    }
    @keyframes shake-warning {
      0%, 100% { transform: rotate(0deg); }
      5%, 15% { transform: rotate(-5deg); }
      10%, 20% { transform: rotate(5deg); }
      25% { transform: rotate(0deg); }
    }

    .warning-container h1 {
      font-size: 2rem;
      margin-bottom: .5rem;
      color: #f59e0b;
    }

    .warning-box {
      max-width: 600px;
      margin: 1.5rem auto 2rem;
      padding: 1.5rem 2rem;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-left: 4px solid #f59e0b;
      border-radius: 12px;
      backdrop-filter: blur(12px);
      text-align: left;
    }
    .warning-box .typewriter {
      font-size: .95rem;
      line-height: 1.7;
      overflow: hidden;
    }
    .warning-box .typewriter .line {
      opacity: 0;
      transform: translateY(8px);
      animation: fade-line .5s ease forwards;
    }
    @keyframes fade-line {
      to { opacity: 1; transform: translateY(0); }
    }

    .warning-details {
      max-width: 600px;
      margin: 0 auto 2rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    .detail-card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 1.2rem;
      backdrop-filter: blur(10px);
      text-align: center;
    }
    .detail-card .detail-icon {
      font-size: 1.5rem;
      display: block;
      margin-bottom: .4rem;
    }
    .detail-card .detail-label {
      font-size: .75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: .5;
      display: block;
      margin-bottom: .2rem;
    }
    .detail-card .detail-value {
      font-weight: 700;
      font-size: .9rem;
    }

    .warning-cta {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 3rem;
    }
    .warning-cta a {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      padding: .7rem 1.5rem;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      color: inherit;
      text-decoration: none;
      font-weight: 600;
      font-size: .9rem;
      backdrop-filter: blur(10px);
      transition: border-color .2s, transform .2s;
    }
    .warning-cta a:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }
    .warning-cta a.primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .warning-cta a.primary:hover {
      background: var(--accent-secondary);
    }

    @media (max-width: 600px) {
      .warning-container h1 { font-size: 1.5rem; }
      .warning-details { grid-template-columns: 1fr; }
      .warning-box { padding: 1.2rem; }
    }
  </style>

  <script async crossorigin="anonymous" src="https://clerk.ventistudio.eu/npm/@clerk/ui@1/dist/ui.browser.js" type="text/javascript"></script>
  <script async crossorigin="anonymous" data-clerk-publishable-key="pk_live_Y2xlcmsudmVudGlzdHVkaW8uZXUk" src="https://clerk.ventistudio.eu/npm/@clerk/clerk-js@6/dist/clerk.browser.js" type="text/javascript"></script>

  <meta property="og:title" content="Accès Refusé | VentiStudio">
  <meta property="og:description" content="VentiStudio - Accès refusé. Le site est actuellement fermé ou inaccessible.">
  <meta property="og:url" content="https://ventistudio.eu/warning-page/">
  <meta property="og:image" content="https://ventistudio.eu/favicon.avif">
  <meta property="og:type" content="website">
  <link rel="canonical" href="https://ventistudio.eu/warning-page/">

  <script>
    (function() {
      var t = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>
 <main>
    <div class="warning-container">
      <span class="warning-icon" aria-hidden="true">🔒</span>
      <h1>Accès Refusé</h1>

      <div class="warning-box">
        <div class="typewriter" id="typewriter">
          <!-- Lines injected by JS with staggered animation -->
        </div>
      </div>

      <div class="warning-details">
        <div class="detail-card">
          <span class="detail-icon" aria-hidden="true">📡</span>
          <span class="detail-label">Statut</span>
          <span class="detail-value">Fermé</span>
        </div>
        <div class="detail-card">
          <span class="detail-icon" aria-hidden="true">🕐</span>
          <span class="detail-label">Heure</span>
          <span class="detail-value" id="current-time"></span>
        </div>
      </div>
    </div>

    <div class="warning-cta">
      <a href="/" class="primary">← Retour à l'accueil</a>
      <a href="/lawful/support">Contacter le support</a>
    </div>
  </main>

  <script src="/main.js" defer></script>
  <script>
    // Typewriter effect with staggered lines
    const lines = [
      'Avertissement : l\'accès à ce site a été refusé.',
      'Pourquoi voyez-vous ce message ?',
      'Il semblerait que VentiStudio.eu est actuellement fermé.',
      'Cette restriction peut être temporaire, Veuillez réessayer ultérieurement.'
    ];

    const container = document.getElementById('typewriter');
    lines.forEach((text, i) => {
      const line = document.createElement('p');
      line.className = 'line';
      line.textContent = text;
      line.style.animationDelay = (i * 0.6) + 's';
      container.appendChild(line);
    });

    // Current time
    const timeEl = document.getElementById('current-time');
    function updateTime() {
      const now = new Date();
      timeEl.textContent = now.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }
    updateTime();
    setInterval(updateTime, 1000);
  </script>
</body>
</html>
