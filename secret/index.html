<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1a1a1a">
  <meta property="og:title" content="VentiStudio  Histoire">
  <meta property="og:site_name" content="VentiStudio">
  <meta property="og:url" content="https://ventistudio.eu/secret">
  <meta property="og:description" content="Hey, je suis Hikari Umaishi (光馬石), mais je préfère que l'on m'appelle Hiuma. Laissez-moi vous présenter ma communauté, un espace où l'art et la créativité se rencontrent.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://ventistudio.eu/favicon.avif">
  <link rel="icon" type="image/avif" href="../favicon.avif">
  <title>VentiStudio  Histoire</title>
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0e0e12;
      color: #e0e0e0;
      font-family: 'Courier New', 'Fira Mono', monospace;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 90%;
      max-width: 820px;
      height: 85vh;
      position: relative;
      padding: 2.5rem 2rem;
    }

    .text-content {
      opacity: 0;
      animation: fadeIn 1.8s ease forwards;
      white-space: pre-line;
      line-height: 1.75;
      font-size: 0.95rem;
      overflow-y: auto;
      height: 100%;
      padding-right: 16px;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    .text-content::-webkit-scrollbar { width: 6px; }
    .text-content::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); border-radius: 3px; }
    .text-content::-webkit-scrollbar-thumb { background: #8b5cf6; border-radius: 3px; }

    #cursor {
      display: inline-block;
      width: 8px;
      height: 1.1em;
      background: #8b5cf6;
      vertical-align: text-bottom;
      margin-left: 2px;
      animation: blink 0.75s step-end infinite;
    }

    @keyframes blink { 50% { opacity: 0; } }
  </style>
</head>
<body>

  <div class="container">
    <div class="text-content" id="storyText"></div>
  </div>

  <script>
    const text = `VentiStudio...

Message du créateur :

VentiStudio a vu le jour en 2016 sous le nom d'Opalux Studio. À la base, ce n'était qu'un projet vidéo Playmobil, mais cela a rapidement changé.

C'est en 2018 que tout commence avec The Lost Site, un projet Roblox dans le thème SCP, qui a fermé en 2019 suite à un ban Roblox injustifié.

En 2019, c'est l'arrivée de VentiStudio, avec pour ambition de créer un univers créatif et de réunir une communauté autour de cela.

Malheureusement, en 2020, VentiStudio ferme ses portes. Il n'y a pas eu grand-chose cette année-là.

Mais en 2021, après la période Covid, c'est l'arrivée du projet Aoki Univers le but : créer une histoire liée à la communauté.

Toutefois, c'est en 2022 que le projet est présenté et qu'un travail monstre est effectué afin de garantir une histoire captivante.

2023… une année très spéciale pour VentiStudio, qui se sépare en plusieurs groupes : Retribution pour les jeux, RushKA pour les applications, VentiStudio pour l'art et Umaishi Corp, la maison mère.
De plus, c'est l'année où j'ai sorti « Voyageur d'Éternité », mon premier morceau musical disponible sur toutes les plateformes.

Mais l'année la plus spéciale, c'est 2024  une année qui a ébranlé VentiStudio. En effet, cette année a été difficile pour la famille Umaishi.
Elle a été une année très particulière, dans le sens où VentiStudio était à deux doigts de perdre une partie de lui suite à un accident très grave.
Par chance, tout s'est presque arrangé, ce qui laisse derrière lui…
…une petite partie de VentiStudio malgré tout. Cette année a vu le site ventistudio.eu se créer une nouvelle identité, avec la sortie de la v2 et la v3 pour 2025.

Nous sommes maintenant en 2025, et j'attends de voir ce qui nous attend.

 Autres informations 

Avec un total de 3 415 projets internes, nous avons formé neuf grands projets, chacun avec sa propre identité et sa portée :

• Aoki Univers : un univers complet comprenant un anime, un manga et de la musique.
• Zone Retribution  The Lost Site : un site basé sur l'univers SCP, qui sera publié sur Roblox et Garry's Mod (et peut-être même sur Minecraft).
• Aina Umaishi : une IA accompagnée de son bot Paimon.
• School Academy : un projet d'école spécial.
• Artiste Store : un magasin regroupant des jeux d'arcade, des mangas et divers articles pour le monde artistique.
• VentiStudio : le site lui-même, qui rassemble tout ce que vous faites.
• Subo Awards : un système de vote pour tout type de contenu artistique.
• Nexus Lumina : une agence artistique communautaire.
• Phare TeiKei : un programme de partenariat et de collaboration.

 Remerciements 

Un grand merci à Melody Rampath, Champy, P0LTERG3IIST, Soki Nasawa, Clément Fernandez, Yui Kobayashi, Futo Gensei, DJ MRS3RKILER, Blak Jumper, Ceroxzila, le petit panda Tomo Umaishi, Sakura Umaishi, Kaito Umaishi, Kimora et Hiroshi Umaishi, Emy Takemichi, Naxcen, Vic, Roan297, ainsi qu'à toutes les autres personnes qui ont laissé leur empreinte.

Chaque contribution a façonné l'histoire de VentiStudio d'une manière unique. Ensemble, vous avez créé quelque chose de spécial.
Continuez à inspirer et à collaborer !

Hikari Umaishi… Fin de transmission…`;

    const el = document.getElementById('storyText');
    let i = 0;

    function type() {
      if (i < text.length) {
        el.textContent += text.charAt(i);
        i++;
        el.scrollTop = el.scrollHeight;
        setTimeout(type, 10);
      } else {
        const cursor = document.createElement('span');
        cursor.id = 'cursor';
        el.appendChild(cursor);
      }
    }

    window.addEventListener('load', () => setTimeout(type, 800));
  </script>

</body>
</html>
