<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <meta name="theme-color" content="#6366f1">
    <meta name="description" content="Service non public : VentiStudio Peer">
    <meta name="robots" content="noindex, nofollow">
    <title>Service Non Public | VentiStudio</title>
    <link rel="stylesheet" href="https://ventistudio.eu/style.css">
    <link rel="icon" href="https://ventistudio.eu/favicon.avif" type="image/avif">
    <style>
        body, html {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        .peer-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 2rem;
        }

        .peer-icon {
            font-size: 5rem;
            margin-bottom: 1.5rem;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.08); opacity: .8; }
        }

        .peer-container h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        .peer-container p {
            font-size: 1.15rem;
            opacity: .8;
            max-width: 500px;
            line-height: 1.6;
        }

        .back-link {
            margin-top: 2rem;
            display: inline-block;
            padding: .6rem 1.4rem;
            border: 1px solid var(--glass-border, rgba(255,255,255,.15));
            border-radius: 8px;
            background: var(--glass-bg, rgba(255,255,255,.05));
            backdrop-filter: blur(12px);
            color: inherit;
            text-decoration: none;
            transition: background .2s, border-color .2s;
        }

        .back-link:hover {
            background: var(--glass-bg-hover, rgba(255,255,255,.1));
            border-color: var(--accent, #6366f1);
        }
    </style>
  <script src="/i18n.js" defer></script>
</head>
<body>
    <main class="peer-container">
        <span class="peer-icon">🚫</span>
        <h1>Service Non Public</h1>
        <p>Vous n'avez rien à faire là, ce service n'est pas public !</p>
        <a href="https://ventistudio.eu/" class="back-link">← Retour à l'accueil</a>
    </main>
    <script src="https://ventistudio.eu/script.js" defer></script>
</body>
</html>
