<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
  <meta name="description" content="Diapo — Éditeur de présentations VentiStudio Suite. Créez des diaporamas en ligne, 100% client-side.">
  <meta name="theme-color" content="#6366f1">
  <link rel="icon" href="/favicon.avif" type="image/avif">
  <title>Diapo — Présentations | VentiStudio Suite</title>
  <link rel="stylesheet" href="/domain/suite/suite.css">
  <link rel="stylesheet" href="/domain/suite/diapo/diapo.css">
  <script>
    (function(){var t=localStorage.getItem('theme')||(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t)})();
  </script>
  <script src="/i18n.js" defer></script>
</head>
<body class="suite-app">


  <div class="suite-header">
    <a href="/domain/suite/" class="suite-logo">
      <img src="/favicon.avif" alt="VentiStudio" width="24" height="24">
      <span>Suite</span>
    </a>
    <span class="suite-app-name" style="background:rgba(245,158,11,0.12);color:#f59e0b">Diapo</span>
    <div class="suite-doc-name">
      <input type="text" id="doc-name" value="Sans titre" aria-label="Nom du document" spellcheck="false">
    </div>
    <div class="suite-actions">
      <div style="position:relative">
        <button class="tb-btn" onclick="toggleDropdown('menu-file')">Fichier ▾</button>
        <div class="suite-dropdown" id="menu-file">
          <button class="suite-dropdown-item" onclick="diapoNew()">Nouveau <span class="shortcut">Ctrl+N</span></button>
          <button class="suite-dropdown-item" onclick="diapoOpen()">Ouvrir .vpres <span class="shortcut">Ctrl+O</span></button>
          <button class="suite-dropdown-item" onclick="diapoSave()">Enregistrer .vpres <span class="shortcut">Ctrl+S</span></button>
          <div class="suite-dropdown-sep"></div>
          <button class="suite-dropdown-item" onclick="diapoExportPDF()">Exporter en PDF</button>
          <button class="suite-dropdown-item" onclick="diapoExportHTML()">Exporter en HTML</button>
        </div>
      </div>
      <button class="suite-btn suite-btn-primary" onclick="diapoPresent()" style="padding:6px 14px;font-size:.8rem">
        ▶ Présenter
      </button>
      <button class="tb-btn" onclick="VSSuite.toggleTheme()" title="Thème">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      </button>
    </div>
  </div>


  <div class="suite-toolbar">
    <div class="tb-group">
      <button class="tb-btn" onclick="diapoAddTitle()" title="Ajouter un titre">
        <svg viewBox="0 0 24 24"><path d="M4 7V4h16v3"/><path d="M9 20h6"/><path d="M12 4v16"/></svg>
        Titre
      </button>
      <button class="tb-btn" onclick="diapoAddText()" title="Ajouter du texte">
        <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        Texte
      </button>
      <button class="tb-btn" onclick="diapoAddImage()" title="Ajouter une image">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        Image
      </button>
      <button class="tb-btn" onclick="diapoAddShape()" title="Ajouter une forme">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
        Forme
      </button>
    </div>
    <div class="tb-sep"></div>
    <div class="tb-group">
      <button class="tb-btn" onclick="diapoDeleteElement()" title="Supprimer l'élément sélectionné">
        <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14H7L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
      </button>
    </div>
    <div class="tb-sep"></div>
    <div class="tb-group">
      <button class="tb-btn" onclick="diapoDuplicateSlide()" title="Dupliquer la diapositive">
        <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
        Dupliquer
      </button>
      <button class="tb-btn" onclick="diapoDeleteSlide()" title="Supprimer la diapositive">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="9" x2="15" y2="15"/><line x1="15" y1="9" x2="9" y2="15"/></svg>
      </button>
      <button class="tb-btn" onclick="diapoMoveSlide(-1)" title="Déplacer vers le haut">▲</button>
      <button class="tb-btn" onclick="diapoMoveSlide(1)" title="Déplacer vers le bas">▼</button>
    </div>
    <div class="tb-sep"></div>
    <div class="tb-group">
      <select class="tb-select" id="tb-transition" title="Transition" style="width:100px" onchange="diapoSetTransition(this.value)">
        <option value="none">Sans transition</option>
        <option value="fade">Fondu</option>
        <option value="slide-left">Glisser gauche</option>
        <option value="slide-right">Glisser droite</option>
        <option value="zoom">Zoom</option>
      </select>
    </div>
  </div>


  <div class="suite-body" style="flex-direction:column;min-height:0">
    <div style="display:flex;flex:1;min-height:0">
      <div class="diapo-sidebar" id="diapo-sidebar"></div>
      <div class="diapo-stage">
        <div class="diapo-slide" id="diapo-slide"></div>
      </div>
      <div class="diapo-props" id="diapo-props"></div>
    </div>

    <div class="diapo-notes-bar">
      <label class="diapo-notes-label">Notes du présentateur</label>
      <textarea class="diapo-notes-input" id="diapo-notes" placeholder="Ajoutez vos notes ici…" rows="3"></textarea>
    </div>
  </div>


  <div class="suite-statusbar">
    <span id="status-slide">Diapo 1 / 1</span>
    <span style="margin-left:auto">Diapo — VentiStudio Suite</span>
  </div>

  <script src="/domain/suite/suite.js"></script>
  <script src="/domain/suite/diapo/diapo.js"></script>
</body>
</html>
