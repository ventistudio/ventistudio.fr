<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
  <meta name="description" content="Note — Carnet de notes VentiStudio Suite. Prenez des notes, créez des listes de tâches, 100% client-side.">
  <meta name="theme-color" content="#6366f1">
  <link rel="icon" href="/favicon.avif" type="image/avif">
  <title>Note — Carnet | VentiStudio Suite</title>
  <link rel="stylesheet" href="/domain/suite/suite.css">
  <link rel="stylesheet" href="/domain/suite/note/note.css">
  <script>
    (function(){var t=localStorage.getItem('theme')||(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t)})();
  </script>
</head>
<body class="suite-app">

  <!-- Header -->
  <div class="suite-header">
    <a href="/domain/suite/" class="suite-logo">
      <img src="/favicon.avif" alt="VentiStudio" width="24" height="24">
      <span>Suite</span>
    </a>
    <span class="suite-app-name" style="background:rgba(139,92,246,0.12);color:#8b5cf6">Note</span>
    <div class="suite-doc-name">
      <input type="text" id="doc-name" value="Mon carnet" aria-label="Nom du carnet" spellcheck="false">
    </div>
    <div class="suite-actions">
      <div style="position:relative">
        <button class="tb-btn" onclick="toggleDropdown('menu-file')">Fichier ▾</button>
        <div class="suite-dropdown" id="menu-file">
          <button class="suite-dropdown-item" onclick="noteNew()">Nouveau carnet <span class="shortcut">Ctrl+N</span></button>
          <button class="suite-dropdown-item" onclick="noteOpen()">Ouvrir .vnote <span class="shortcut">Ctrl+O</span></button>
          <button class="suite-dropdown-item" onclick="noteSave()">Enregistrer .vnote <span class="shortcut">Ctrl+S</span></button>
          <div class="suite-dropdown-sep"></div>
          <button class="suite-dropdown-item" onclick="noteExportPDF()">Exporter en PDF</button>
          <button class="suite-dropdown-item" onclick="noteExportHTML()">Exporter en HTML</button>
          <button class="suite-dropdown-item" onclick="noteExportText()">Exporter en texte brut</button>
        </div>
      </div>
      <button class="tb-btn" onclick="VSSuite.toggleTheme()" title="Thème">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      </button>
    </div>
  </div>

  <!-- Toolbar -->
  <div class="suite-toolbar">
    <div class="tb-group">
      <select class="tb-select" id="tb-heading" title="Style">
        <option value="">Paragraphe…</option>
        <option value="p">Normal</option>
        <option value="h1">Titre 1</option>
        <option value="h2">Titre 2</option>
        <option value="h3">Titre 3</option>
        <option value="blockquote">Citation</option>
        <option value="pre">Code</option>
      </select>
    </div>
    <div class="tb-sep"></div>
    <div class="tb-group">
      <button class="tb-btn" data-cmd="bold" title="Gras"><svg viewBox="0 0 24 24"><path d="M6 4h8a4 4 0 014 4 4 4 0 01-4 4H6z"/><path d="M6 12h9a4 4 0 014 4 4 4 0 01-4 4H6z"/></svg></button>
      <button class="tb-btn" data-cmd="italic" title="Italique"><svg viewBox="0 0 24 24"><line x1="19" y1="4" x2="10" y2="4"/><line x1="14" y1="20" x2="5" y2="20"/><line x1="15" y1="4" x2="9" y2="20"/></svg></button>
      <button class="tb-btn" data-cmd="underline" title="Souligné"><svg viewBox="0 0 24 24"><path d="M6 3v7a6 6 0 006 6 6 6 0 006-6V3"/><line x1="4" y1="21" x2="20" y2="21"/></svg></button>
      <button class="tb-btn" data-cmd="strikeThrough" title="Barré"><svg viewBox="0 0 24 24"><path d="M16 4H9a3 3 0 00-3 3v0a3 3 0 003 3h6"/><line x1="4" y1="12" x2="20" y2="12"/><path d="M8 20h7a3 3 0 003-3v0a3 3 0 00-3-3H9"/></svg></button>
    </div>
    <div class="tb-sep"></div>
    <div class="tb-group">
      <button class="tb-btn" data-cmd="insertUnorderedList" title="Liste à puces"><svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="4" cy="6" r="1" fill="currentColor"/><circle cx="4" cy="12" r="1" fill="currentColor"/><circle cx="4" cy="18" r="1" fill="currentColor"/></svg></button>
      <button class="tb-btn" data-cmd="insertOrderedList" title="Liste numérotée"><svg viewBox="0 0 24 24"><line x1="10" y1="6" x2="21" y2="6"/><line x1="10" y1="12" x2="21" y2="12"/><line x1="10" y1="18" x2="21" y2="18"/><text x="2" y="8" font-size="7" fill="currentColor">1.</text><text x="2" y="14" font-size="7" fill="currentColor">2.</text><text x="2" y="20" font-size="7" fill="currentColor">3.</text></svg></button>
      <button class="tb-btn" onclick="noteInsertCheckbox()" title="Liste de tâches"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="6" height="6" rx="1"/><path d="M5 8l1 1 2-2"/><line x1="12" y1="8" x2="21" y2="8"/><rect x="3" y="14" width="6" height="6" rx="1"/><line x1="12" y1="17" x2="21" y2="17"/></svg></button>
    </div>
    <div class="tb-sep"></div>
    <div class="tb-group">
      <button class="tb-btn" data-cmd="insertHorizontalRule" title="Séparateur"><svg viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"/></svg></button>
    </div>
    <div class="tb-sep"></div>
    <!-- Colors -->
    <div class="tb-group">
      <label class="tb-btn" title="Couleur du texte" style="position:relative">
        <input type="color" id="tb-text-color" value="#e0e0e0" style="width:0;height:0;opacity:0;position:absolute;left:0;top:0">
        <svg viewBox="0 0 24 24"><path d="M11 4L6 20"/><path d="M13 4l5 16"/><path d="M8 12h8"/><line x1="5" y1="22" x2="19" y2="22" stroke-width="3"/></svg>
      </label>
      <label class="tb-btn" title="Surligner" style="position:relative">
        <input type="color" id="tb-highlight" value="#fde047" style="width:0;height:0;opacity:0;position:absolute;left:0;top:0">
        <svg viewBox="0 0 24 24"><rect x="3" y="14" width="18" height="6" rx="1" fill="currentColor" opacity=".3"/><path d="M9 3l6 11H9"/></svg>
      </label>
    </div>
    <div class="tb-sep"></div>
    <!-- Indent -->
    <div class="tb-group">
      <button class="tb-btn" data-cmd="indent" title="Augmenter le retrait"><svg viewBox="0 0 24 24"><line x1="3" y1="8" x2="21" y2="8"/><line x1="3" y1="16" x2="21" y2="16"/><line x1="7" y1="12" x2="21" y2="12"/><polyline points="3 10 5 12 3 14"/></svg></button>
      <button class="tb-btn" data-cmd="outdent" title="Diminuer le retrait"><svg viewBox="0 0 24 24"><line x1="3" y1="8" x2="21" y2="8"/><line x1="3" y1="16" x2="21" y2="16"/><line x1="7" y1="12" x2="21" y2="12"/><polyline points="5 10 3 12 5 14"/></svg></button>
    </div>
    <div class="tb-sep"></div>
    <!-- Insert -->
    <div class="tb-group">
      <button class="tb-btn" onclick="noteInsertTable()" title="Insérer un tableau"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/></svg></button>
      <button class="tb-btn" onclick="noteInsertImage()" title="Insérer une image"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg></button>
      <button class="tb-btn" onclick="noteInsertLink()" title="Insérer un lien"><svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg></button>
    </div>
    <div class="tb-sep"></div>
    <!-- Tags -->
    <div class="tb-group">
      <select class="tb-select" id="tb-tags" title="Insérer un tag" style="width:100px">
        <option value="">Tag…</option>
        <option value="important">⭐ Important</option>
        <option value="todo">☑ À faire</option>
        <option value="question">❓ Question</option>
        <option value="idea">💡 Idée</option>
        <option value="remember">📌 À retenir</option>
      </select>
    </div>
  </div>

  <!-- Body -->
  <div class="suite-body">
    <!-- Sidebar with pages -->
    <div class="note-sidebar" id="note-sidebar">
      <div class="note-sidebar-header">
        <input type="text" id="note-search" placeholder="Rechercher…" aria-label="Rechercher une page">
      </div>
      <div class="note-page-list" id="note-pages"></div>
      <button class="note-add-page" onclick="noteAddPage()">+ Nouvelle page</button>
    </div>

    <!-- Editor -->
    <div class="note-editor-area">
      <input type="text" class="note-title-input" id="note-title" placeholder="Titre de la page" aria-label="Titre de la page">
      <div class="note-meta" id="note-meta"></div>
      <div class="note-editor" id="note-editor" contenteditable="true" spellcheck="true" role="textbox" aria-multiline="true" aria-label="Contenu de la note">
      </div>
    </div>
  </div>

  <!-- Status Bar -->
  <div class="suite-statusbar">
    <span id="status-pages">Page 1 / 1</span>
    <span id="status-words">0 mot</span>
    <span style="margin-left:auto">Note — VentiStudio Suite</span>
  </div>

  <script src="/domain/suite/suite.js"></script>
  <script src="/domain/suite/note/note.js"></script>
</body>
</html>
