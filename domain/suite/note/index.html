<!DOCTYPE html>

<html data-theme="dark" lang="fr">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, shrink-to-fit=no" name="viewport"/>
<meta content="Note  Carnet de notes VentiStudio Suite. Prenez des notes, créez des listes de tâches, 100% client-side." name="description"/>
<meta content="#6366f1" name="theme-color"/>
<link href="/favicon.avif" rel="icon" type="image/avif"/>
<title>Note  Carnet | VentiStudio Suite</title>
<link href="/domain/suite/suite.css" rel="stylesheet"/>
<link href="/domain/suite/note/note.css" rel="stylesheet"/>
<script>
    (function(){var t=localStorage.getItem('theme')||(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t)})();
  </script>
<script defer="" src="/i18n.js"></script>
</head>
<body class="suite-app">
<div class="suite-header">
<a class="suite-logo" href="/domain/suite/">
<img alt="VentiStudio" data-i18n-attr="alt:domain.suite.note.suite_header_suite_logo.img_alt" height="24" src="/favicon.avif" width="24"/>
<span>Suite</span>
</a>
<span class="suite-app-name" style="background:rgba(139,92,246,0.12);color:#8b5cf6">Note</span>
<div class="suite-doc-name">
<input aria-label="Nom du carnet" id="doc-name" spellcheck="false" type="text" value="Mon carnet"/>
</div>
<div class="suite-actions">
<div style="position:relative">
<button class="tb-btn" data-i18n="domain.suite.note.suite_header_suite_actions.button" onclick="toggleDropdown('menu-file')">Fichier ▾</button>
<div class="suite-dropdown" id="menu-file">
<button class="suite-dropdown-item" data-i18n-html="domain.suite.note.menu_file.button" onclick="noteNew()">Nouveau carnet <span class="shortcut">Ctrl+N</span></button>
<button class="suite-dropdown-item" data-i18n-html="domain.suite.note.menu_file.button2" onclick="noteOpen()">Ouvrir .vnote <span class="shortcut">Ctrl+O</span></button>
<button class="suite-dropdown-item" data-i18n-html="domain.suite.note.menu_file.button3" onclick="noteSave()">Enregistrer .vnote <span class="shortcut">Ctrl+S</span></button>
<div class="suite-dropdown-sep"></div>
<button class="suite-dropdown-item" data-i18n="domain.suite.note.menu_file.button4" onclick="noteExportPDF()">Exporter en PDF</button>
<button class="suite-dropdown-item" data-i18n="domain.suite.note.menu_file.button5" onclick="noteExportHTML()">Exporter en HTML</button>
<button class="suite-dropdown-item" data-i18n="domain.suite.note.menu_file.button6" onclick="noteExportText()">Exporter en texte brut</button>
</div>
</div>
<button class="tb-btn" onclick="VSSuite.toggleTheme()" title="Thème">
<svg viewbox="0 0 24 24"><circle cx="12" cy="12" r="5"></circle><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path></svg>
</button>
</div>
</div>
<div class="suite-toolbar">
<div class="tb-group">
<select class="tb-select" id="tb-heading" title="Style">
<option value="">Paragraphe…</option>
<option value="p">Normal</option>
<option value="h1">Titre 1</option>
<option value="h2">Titre 2</option>
<option value="h3">Titre 3</option>
<option value="blockquote">Citation</option>
<option value="pre">Code</option>
</select>
</div>
<div class="tb-sep"></div>
<div class="tb-group">
<button class="tb-btn" data-cmd="bold" title="Gras"><svg viewbox="0 0 24 24"><path d="M6 4h8a4 4 0 014 4 4 4 0 01-4 4H6z"></path><path d="M6 12h9a4 4 0 014 4 4 4 0 01-4 4H6z"></path></svg></button>
<button class="tb-btn" data-cmd="italic" title="Italique"><svg viewbox="0 0 24 24"><line x1="19" x2="10" y1="4" y2="4"></line><line x1="14" x2="5" y1="20" y2="20"></line><line x1="15" x2="9" y1="4" y2="20"></line></svg></button>
<button class="tb-btn" data-cmd="underline" title="Souligné"><svg viewbox="0 0 24 24"><path d="M6 3v7a6 6 0 006 6 6 6 0 006-6V3"></path><line x1="4" x2="20" y1="21" y2="21"></line></svg></button>
<button class="tb-btn" data-cmd="strikeThrough" title="Barré"><svg viewbox="0 0 24 24"><path d="M16 4H9a3 3 0 00-3 3v0a3 3 0 003 3h6"></path><line x1="4" x2="20" y1="12" y2="12"></line><path d="M8 20h7a3 3 0 003-3v0a3 3 0 00-3-3H9"></path></svg></button>
</div>
<div class="tb-sep"></div>
<div class="tb-group">
<button class="tb-btn" data-cmd="insertUnorderedList" title="Liste à puces"><svg viewbox="0 0 24 24"><line x1="8" x2="21" y1="6" y2="6"></line><line x1="8" x2="21" y1="12" y2="12"></line><line x1="8" x2="21" y1="18" y2="18"></line><circle cx="4" cy="6" fill="currentColor" r="1"></circle><circle cx="4" cy="12" fill="currentColor" r="1"></circle><circle cx="4" cy="18" fill="currentColor" r="1"></circle></svg></button>
<button class="tb-btn" data-cmd="insertOrderedList" title="Liste numérotée"><svg viewbox="0 0 24 24"><line x1="10" x2="21" y1="6" y2="6"></line><line x1="10" x2="21" y1="12" y2="12"></line><line x1="10" x2="21" y1="18" y2="18"></line><text fill="currentColor" font-size="7" x="2" y="8">1.</text><text fill="currentColor" font-size="7" x="2" y="14">2.</text><text fill="currentColor" font-size="7" x="2" y="20">3.</text></svg></button>
<button class="tb-btn" onclick="noteInsertCheckbox()" title="Liste de tâches"><svg viewbox="0 0 24 24"><rect height="6" rx="1" width="6" x="3" y="5"></rect><path d="M5 8l1 1 2-2"></path><line x1="12" x2="21" y1="8" y2="8"></line><rect height="6" rx="1" width="6" x="3" y="14"></rect><line x1="12" x2="21" y1="17" y2="17"></line></svg></button>
</div>
<div class="tb-sep"></div>
<div class="tb-group">
<button class="tb-btn" data-cmd="insertHorizontalRule" title="Séparateur"><svg viewbox="0 0 24 24"><line x1="3" x2="21" y1="12" y2="12"></line></svg></button>
</div>
<div class="tb-sep"></div>
<div class="tb-group">
<label class="tb-btn" style="position:relative" title="Couleur du texte">
<input id="tb-text-color" style="width:0;height:0;opacity:0;position:absolute;left:0;top:0" type="color" value="#e0e0e0"/>
<svg viewbox="0 0 24 24"><path d="M11 4L6 20"></path><path d="M13 4l5 16"></path><path d="M8 12h8"></path><line stroke-width="3" x1="5" x2="19" y1="22" y2="22"></line></svg>
</label>
<label class="tb-btn" style="position:relative" title="Surligner">
<input id="tb-highlight" style="width:0;height:0;opacity:0;position:absolute;left:0;top:0" type="color" value="#fde047"/>
<svg viewbox="0 0 24 24"><rect fill="currentColor" height="6" opacity=".3" rx="1" width="18" x="3" y="14"></rect><path d="M9 3l6 11H9"></path></svg>
</label>
</div>
<div class="tb-sep"></div>
<div class="tb-group">
<button class="tb-btn" data-cmd="indent" title="Augmenter le retrait"><svg viewbox="0 0 24 24"><line x1="3" x2="21" y1="8" y2="8"></line><line x1="3" x2="21" y1="16" y2="16"></line><line x1="7" x2="21" y1="12" y2="12"></line><polyline points="3 10 5 12 3 14"></polyline></svg></button>
<button class="tb-btn" data-cmd="outdent" title="Diminuer le retrait"><svg viewbox="0 0 24 24"><line x1="3" x2="21" y1="8" y2="8"></line><line x1="3" x2="21" y1="16" y2="16"></line><line x1="7" x2="21" y1="12" y2="12"></line><polyline points="5 10 3 12 5 14"></polyline></svg></button>
</div>
<div class="tb-sep"></div>
<div class="tb-group">
<button class="tb-btn" onclick="noteInsertTable()" title="Insérer un tableau"><svg viewbox="0 0 24 24"><rect height="18" rx="2" width="18" x="3" y="3"></rect><line x1="3" x2="21" y1="9" y2="9"></line><line x1="3" x2="21" y1="15" y2="15"></line><line x1="9" x2="9" y1="3" y2="21"></line><line x1="15" x2="15" y1="3" y2="21"></line></svg></button>
<button class="tb-btn" onclick="noteInsertImage()" title="Insérer une image"><svg viewbox="0 0 24 24"><rect height="18" rx="2" width="18" x="3" y="3"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><path d="M21 15l-5-5L5 21"></path></svg></button>
<button class="tb-btn" onclick="noteInsertLink()" title="Insérer un lien"><svg viewbox="0 0 24 24"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"></path></svg></button>
</div>
<div class="tb-sep"></div>
<div class="tb-group">
<select class="tb-select" id="tb-tags" style="width:100px" title="Insérer un tag">
<option value="">Tag…</option>
<option value="important">⭐ Important</option>
<option value="todo">☑ À faire</option>
<option value="question">❓ Question</option>
<option value="idea">💡 Idée</option>
<option value="remember">📌 À retenir</option>
</select>
</div>
</div>
<div class="suite-body">
<div class="note-sidebar" id="note-sidebar">
<div class="note-sidebar-header">
<input aria-label="Rechercher une page" data-i18n-attr="placeholder:domain.suite.note.note_sidebar_note_sidebar_header.input_placeholder" id="note-search" placeholder="Rechercher…" type="text"/>
</div>
<div class="note-page-list" id="note-pages"></div>
<button class="note-add-page" data-i18n="domain.suite.note.note_sidebar.button" onclick="noteAddPage()">+ Nouvelle page</button>
</div>
<div class="note-editor-area">
<input aria-label="Titre de la page" class="note-title-input" data-i18n-attr="placeholder:domain.suite.note.suite_body_note_editor_area.input_placeholder" id="note-title" placeholder="Titre de la page" type="text"/>
<div class="note-meta" id="note-meta"></div>
<div aria-label="Contenu de la note" aria-multiline="true" class="note-editor" contenteditable="true" id="note-editor" role="textbox" spellcheck="true">
</div>
</div>
</div>
<div class="suite-statusbar">
<span id="status-pages">Page 1 / 1</span>
<span id="status-words">0 mot</span>
<span style="margin-left:auto">Note  VentiStudio Suite</span>
</div>
<script src="/domain/suite/suite.js"></script>
<script src="/domain/suite/note/note.js"></script>
<script defer src="/antibot.js"></script>
</body>
</html>
