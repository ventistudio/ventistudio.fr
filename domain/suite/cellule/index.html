<!DOCTYPE html>

<html data-theme="dark" lang="fr">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, shrink-to-fit=no" name="viewport"/>
<meta content="Cellule  Tableur VentiStudio Suite. Créez des feuilles de calcul avec formules, 100% client-side." name="description"/>
<meta content="#6366f1" name="theme-color"/>
<link href="/favicon.avif" rel="icon" type="image/avif"/>
<title>Cellule  Tableur | VentiStudio Suite</title>
<link href="/domain/suite/suite.css" rel="stylesheet"/>
<link href="/domain/suite/cellule/cellule.css" rel="stylesheet"/>
<script>
    (function(){var t=localStorage.getItem('theme')||(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t)})();
  </script>
<script defer="" src="/i18n.js"></script>
</head>
<body class="suite-app">
<div class="suite-header">
<a class="suite-logo" href="/domain/suite/">
<img alt="VentiStudio" data-i18n-attr="alt:domain.suite.cellule.suite_header_suite_logo.img_alt" height="24" src="/favicon.avif" width="24"/>
<span>Suite</span>
</a>
<span class="suite-app-name" style="background:rgba(16,185,129,0.12);color:#10b981">Cellule</span>
<div class="suite-doc-name">
<input aria-label="Nom du document" id="doc-name" spellcheck="false" type="text" value="Sans titre"/>
</div>
<div class="suite-actions">
<div style="position:relative">
<button class="tb-btn" data-i18n="domain.suite.cellule.suite_header_suite_actions.button" onclick="toggleDropdown('menu-file')">Fichier ▾</button>
<div class="suite-dropdown" id="menu-file">
<button class="suite-dropdown-item" data-i18n-html="domain.suite.cellule.menu_file.button" onclick="celluleNew()">Nouveau <span class="shortcut">Ctrl+N</span></button>
<button class="suite-dropdown-item" data-i18n-html="domain.suite.cellule.menu_file.button2" onclick="celluleOpen()">Ouvrir .vcal <span class="shortcut">Ctrl+O</span></button>
<button class="suite-dropdown-item" data-i18n-html="domain.suite.cellule.menu_file.button3" onclick="celluleSave()">Enregistrer .vcal <span class="shortcut">Ctrl+S</span></button>
<div class="suite-dropdown-sep"></div>
<button class="suite-dropdown-item" data-i18n="domain.suite.cellule.menu_file.button4" onclick="celluleExportPDF()">Exporter en PDF</button>
<button class="suite-dropdown-item" data-i18n="domain.suite.cellule.menu_file.button5" onclick="celluleExportCSV()">Exporter en CSV</button>
<button class="suite-dropdown-item" data-i18n="domain.suite.cellule.menu_file.button6" onclick="celluleExportHTML()">Exporter en HTML</button>
</div>
</div>
<button class="tb-btn" onclick="VSSuite.toggleTheme()" title="Thème">
<svg viewbox="0 0 24 24"><circle cx="12" cy="12" r="5"></circle><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path></svg>
</button>
</div>
</div>
<div class="cellule-formula-bar">
<span class="cell-ref" id="cell-ref">A1</span>
<span class="fx-label">fx</span>
<input aria-label="Barre de formule" data-i18n-attr="placeholder:domain.suite.cellule.cellule_formula_bar.input_placeholder" id="fx-input" placeholder="Entrez une valeur ou formule (ex: =SUM(A1:A10))" type="text"/>
</div>
<div class="cellule-format-bar">
<div class="tb-group">
<button class="tb-btn" id="fmt-bold" onclick="celluleToggleStyle('bold')" title="Gras"><svg viewbox="0 0 24 24"><path d="M6 4h8a4 4 0 014 4 4 4 0 01-4 4H6z"></path><path d="M6 12h9a4 4 0 014 4 4 4 0 01-4 4H6z"></path></svg></button>
<button class="tb-btn" id="fmt-italic" onclick="celluleToggleStyle('italic')" title="Italique"><svg viewbox="0 0 24 24"><line x1="19" x2="10" y1="4" y2="4"></line><line x1="14" x2="5" y1="20" y2="20"></line><line x1="15" x2="9" y1="4" y2="20"></line></svg></button>
<button class="tb-btn" id="fmt-underline" onclick="celluleToggleStyle('underline')" title="Souligné"><svg viewbox="0 0 24 24"><path d="M6 3v7a6 6 0 006 6 6 6 0 006-6V3"></path><line x1="4" x2="20" y1="21" y2="21"></line></svg></button>
</div>
<div class="tb-sep"></div>
<div class="tb-group">
<label class="tb-btn" style="padding:0" title="Couleur du texte"><input id="fmt-color" style="width:24px;height:24px;border:none;background:none;cursor:pointer;padding:0" type="color" value="#e0e0e0"/></label>
<label class="tb-btn" style="padding:0" title="Couleur de fond"><input id="fmt-bg" style="width:24px;height:24px;border:none;background:none;cursor:pointer;padding:0" type="color" value="#16161f"/></label>
</div>
<div class="tb-sep"></div>
<div class="tb-group">
<button class="tb-btn" onclick="celluleSetAlign('left')" title="Gauche"><svg viewbox="0 0 24 24"><line x1="17" x2="3" y1="10" y2="10"></line><line x1="21" x2="3" y1="6" y2="6"></line><line x1="21" x2="3" y1="14" y2="14"></line><line x1="17" x2="3" y1="18" y2="18"></line></svg></button>
<button class="tb-btn" onclick="celluleSetAlign('center')" title="Centre"><svg viewbox="0 0 24 24"><line x1="18" x2="6" y1="10" y2="10"></line><line x1="21" x2="3" y1="6" y2="6"></line><line x1="21" x2="3" y1="14" y2="14"></line><line x1="18" x2="6" y1="18" y2="18"></line></svg></button>
<button class="tb-btn" onclick="celluleSetAlign('right')" title="Droite"><svg viewbox="0 0 24 24"><line x1="21" x2="7" y1="10" y2="10"></line><line x1="21" x2="3" y1="6" y2="6"></line><line x1="21" x2="3" y1="14" y2="14"></line><line x1="21" x2="7" y1="18" y2="18"></line></svg></button>
</div>
<div class="tb-sep"></div>
<div class="tb-group">
<select class="tb-select" id="fmt-numformat" onchange="celluleSetFormat(this.value)" style="width:100px" title="Format de nombre">
<option value="general">Général</option>
<option value="number">Nombre</option>
<option value="currency">Monnaie €</option>
<option value="percent">Pourcentage %</option>
<option value="date">Date</option>
</select>
</div>
<div class="tb-sep"></div>
<div class="tb-group">
<button class="tb-btn" data-i18n="domain.suite.cellule.cellule_format_bar_tb_group.button" onclick="celluleSort(true)" title="Trier A → Z">A↓</button>
<button class="tb-btn" data-i18n="domain.suite.cellule.cellule_format_bar_tb_group.button2" onclick="celluleSort(false)" title="Trier Z → A">Z↓</button>
</div>
<div class="tb-sep"></div>
<div class="tb-group">
<button class="tb-btn" onclick="celluleToggleWrap()" title="Retour à la ligne"><svg viewbox="0 0 24 24"><path d="M3 6h18"></path><path d="M3 12h15a3 3 0 010 6H9"></path><polyline points="12 15 9 18 12 21"></polyline></svg></button>
</div>
</div>
<div class="suite-body" style="flex-direction:column">
<div class="cellule-container" id="cellule-container"></div>
<div class="cellule-tabs" id="cellule-tabs"></div>
</div>
<div class="suite-statusbar">
<span id="status-sel">A1</span>
<span id="status-sum"></span>
<span style="margin-left:auto">Cellule  VentiStudio Suite</span>
</div>
<script src="/domain/suite/suite.js"></script>
<script src="/domain/suite/cellule/cellule.js"></script>
<script defer src="/antibot.js"></script>
</body>
</html>
