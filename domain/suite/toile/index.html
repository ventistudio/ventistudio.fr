<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
  <meta name="description" content="Toile — Tableau blanc et dessin VentiStudio Suite. Dessinez, annotez, créez des schémas, 100% client-side.">
  <meta name="theme-color" content="#6366f1">
  <link rel="icon" href="/favicon.avif" type="image/avif">
  <title>Toile — Dessin | VentiStudio Suite</title>
  <link rel="stylesheet" href="/domain/suite/suite.css">
  <link rel="stylesheet" href="/domain/suite/toile/toile.css">
  <script>
    (function(){var t=localStorage.getItem('theme')||(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t)})();
  </script>
</head>
<body class="suite-app">

  <!-- Header -->
  <div class="suite-header">
    <a href="/domain/suite/" class="suite-logo">
      <img src="/favicon.avif" alt="VentiStudio" width="24" height="24">
      <span>Suite</span>
    </a>
    <span class="suite-app-name" style="background:rgba(236,72,153,0.12);color:#ec4899">Toile</span>
    <div class="suite-doc-name">
      <input type="text" id="doc-name" value="Sans titre" aria-label="Nom du dessin" spellcheck="false">
    </div>
    <div class="suite-actions">
      <div style="position:relative">
        <button class="tb-btn" onclick="toggleDropdown('menu-file')">Fichier ▾</button>
        <div class="suite-dropdown" id="menu-file">
          <button class="suite-dropdown-item" onclick="toileNew()">Nouveau <span class="shortcut">Ctrl+N</span></button>
          <button class="suite-dropdown-item" onclick="toileOpen()">Ouvrir .vdraw <span class="shortcut">Ctrl+O</span></button>
          <button class="suite-dropdown-item" onclick="toileSave()">Enregistrer .vdraw <span class="shortcut">Ctrl+S</span></button>
          <div class="suite-dropdown-sep"></div>
          <button class="suite-dropdown-item" onclick="toileExportPNG()">Exporter en PNG</button>
          <button class="suite-dropdown-item" onclick="toileExportPDF()">Exporter en PDF</button>
        </div>
      </div>
      <button class="tb-btn" onclick="toileUndo()" title="Annuler (Ctrl+Z)">
        <svg viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/></svg>
      </button>
      <button class="tb-btn" onclick="toileRedo()" title="Rétablir (Ctrl+Y)">
        <svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.13-9.36L23 10"/></svg>
      </button>
      <button class="tb-btn" onclick="toileClear()" title="Tout effacer">
        <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14H7L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
      </button>
      <button class="tb-btn" onclick="VSSuite.toggleTheme()" title="Thème">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      </button>
    </div>
  </div>

  <!-- Body -->
  <div class="toile-body">
    <!-- Tool palette -->
    <div class="toile-tools">
      <button class="toile-tool active" data-tool="pen" title="Crayon">
        <svg viewBox="0 0 24 24"><path d="M17 3a2.828 2.828 0 114 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>
      </button>
      <button class="toile-tool" data-tool="eraser" title="Gomme">
        <svg viewBox="0 0 24 24"><path d="M20 20H7L3 16c-.8-.8-.8-2 0-2.8L14.8 1.4c.8-.8 2-.8 2.8 0l5 5c.8.8.8 2 0 2.8L12.5 19.5"/></svg>
      </button>
      <div class="toile-tool-sep"></div>
      <button class="toile-tool" data-tool="line" title="Ligne">
        <svg viewBox="0 0 24 24"><line x1="5" y1="19" x2="19" y2="5"/></svg>
      </button>
      <button class="toile-tool" data-tool="arrow" title="Flèche">
        <svg viewBox="0 0 24 24"><line x1="5" y1="19" x2="19" y2="5"/><polyline points="13 5 19 5 19 11"/></svg>
      </button>
      <button class="toile-tool" data-tool="rect" title="Rectangle">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
      </button>
      <button class="toile-tool" data-tool="ellipse" title="Ellipse">
        <svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="10" ry="7"/></svg>
      </button>
      <button class="toile-tool" data-tool="triangle" title="Triangle">
        <svg viewBox="0 0 24 24"><polygon points="12,3 22,21 2,21"/></svg>
      </button>
      <button class="toile-tool" data-tool="diamond" title="Losange">
        <svg viewBox="0 0 24 24"><polygon points="12,2 22,12 12,22 2,12"/></svg>
      </button>
      <button class="toile-tool" data-tool="star" title="Étoile">
        <svg viewBox="0 0 24 24"><polygon points="12,2 15,9 22,9 16,14 18,21 12,17 6,21 8,14 2,9 9,9"/></svg>
      </button>
      <div class="toile-tool-sep"></div>
      <button class="toile-tool" data-tool="text" title="Texte">
        <svg viewBox="0 0 24 24"><path d="M4 7V4h16v3"/><path d="M9 20h6"/><path d="M12 4v16"/></svg>
      </button>
    </div>

    <!-- Canvas -->
    <div class="toile-canvas-wrap grid-bg" id="toile-canvas-wrap">
      <canvas id="toile-canvas"></canvas>
    </div>

    <!-- Properties -->
    <div class="toile-props">
      <h4>Couleur du trait</h4>
      <label>
        <input type="color" id="prop-color" value="#e0e0e0">
        Trait
      </label>
      <div class="toile-color-presets" id="color-presets"></div>

      <h4>Remplissage</h4>
      <label>
        <input type="color" id="prop-fill" value="#6366f1">
        Fond
      </label>

      <h4>Épaisseur</h4>
      <label>
        <input type="range" id="prop-size" min="1" max="20" value="3">
        <span id="prop-size-val">3px</span>
      </label>

      <h4>Opacité</h4>
      <label>
        <input type="range" id="prop-opacity" min="10" max="100" value="100" step="5">
        <span id="prop-opacity-val">100%</span>
      </label>

      <h4>Grille</h4>
      <label>
        <input type="checkbox" id="prop-grid-snap"> Aimanter à la grille
      </label>
    </div>
  </div>

  <!-- Status Bar -->
  <div class="suite-statusbar">
    <span id="status-objects">0 objet</span>
    <span style="margin-left:auto;display:flex;align-items:center;gap:6px">
      <button class="toile-zoom-btn" onclick="toileZoom(-10)" title="Zoom arrière">−</button>
      <span id="zoom-level" style="min-width:36px;text-align:center;font-size:.75rem">100%</span>
      <button class="toile-zoom-btn" onclick="toileZoom(10)" title="Zoom avant">+</button>
    </span>
  </div>

  <script src="/domain/suite/suite.js"></script>
  <script src="/domain/suite/toile/toile.js"></script>
</body>
</html>
