<style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        :root {
            --vh: 1vh;
        }

        /* Animation de chargement */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: calc(var(--vh, 1vh) * 100);
            background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-content {
            font-family: 'Courier New', monospace;
            color: #6366f1;
            font-size: clamp(14px, 3vw, 20px);
            text-align: left;
            padding: 20px;
            max-width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100px;
        }

        .loading-message {
            opacity: 0;
            text-shadow: 0 0 10px rgba(99, 102, 241, 0.5);
            letter-spacing: 1px;
            animation: fadeIn 0.3s ease-in forwards;
            line-height: 1.5;
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
                transform: translateY(0);
            }
            to {
                opacity: 0;
                transform: translateY(-10px);
            }
        }

        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }

        .error-glitch {
            color: #ff006e;
            animation: glitch 0.3s infinite;
        }

        /* Contenu principal */
        .container-404 {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: calc(var(--vh, 1vh) * 100);
            width: 100vw;
            background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 100%);
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: clamp(15px, 2vh, 20px);
            text-align: center;
            opacity: 0;
            animation: fadeIn 1s ease-in 0.5s forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .error-box {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: clamp(20px, 3vh, 40px) clamp(20px, 3vw, 35px);
            max-width: min(500px, 90vw);
            width: 100%;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(99, 102, 241, 0.2);
            animation: slideUp 0.8s ease-out 0.5s backwards;
            max-height: 90vh;
            overflow-y: auto;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .error-box h1 {
            font-size: clamp(32px, 8vw, 70px);
            margin: 0 0 clamp(10px, 1.5vh, 15px) 0;
            color: #6366f1;
            font-weight: 900;
            text-shadow: 0 0 30px rgba(99, 102, 241, 0.5);
            font-family: 'Courier New', monospace;
            letter-spacing: clamp(2px, 0.4vw, 6px);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { text-shadow: 0 0 30px rgba(99, 102, 241, 0.5); }
            50% { text-shadow: 0 0 50px rgba(99, 102, 241, 0.8); }
        }

        .error-box h2 {
            font-size: clamp(16px, 3.5vw, 26px);
            margin: 0 0 clamp(8px, 1.2vh, 12px) 0;
            color: #6366f1;
            font-family: 'Courier New', monospace;
            letter-spacing: clamp(1px, 0.15vw, 2px);
        }

        .error-box p {
            font-size: clamp(12px, 2vw, 15px);
            color: #b0b0b0;
            margin: 0 0 clamp(8px, 1.5vh, 15px) 0;
            line-height: 1.5;
        }

        .error-alert {
            font-size: clamp(11px, 1.6vw, 13px);
            color: #9333ea;
            margin: 0 0 clamp(8px, 1.5vh, 15px) 0;
            font-family: 'Courier New', monospace;
            letter-spacing: 1px;
            animation: blink 1.5s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0.3; }
        }

        .nav-404 {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: clamp(12px, 2vh, 20px);
        }

        .nav-404 a {
            display: inline-block;
            padding: clamp(8px, 1.2vh, 10px) clamp(15px, 2.5vw, 25px);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
            font-family: 'Courier New', monospace;
            font-size: clamp(11px, 1.6vw, 14px);
        }

        .nav-404 a:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .nav-404 a:first-child {
            background: linear-gradient(135deg, #6366f1, #9333ea);
            border: 1px solid transparent;
        }

        .nav-404 a:last-child {
            background: transparent;
            color: #6366f1;
            border: 2px solid #6366f1;
        }

        .error-footer {
            font-size: clamp(9px, 1.3vw, 11px);
            color: #808080;
            margin-top: clamp(15px, 2.5vh, 30px);
            margin-bottom: 0;
        }

        .error-footer a {
            color: #6366f1;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .error-footer a:hover {
            color: #9333ea;
        }

        @media (max-width: 768px) and (orientation: portrait) {
            .container-404 {
                padding: 15px;
            }

            .nav-404 {
                flex-direction: column;
                gap: 8px;
            }

            .nav-404 a {
                width: 100%;
            }

            .error-box h1 {
                font-size: clamp(28px, 7vw, 50px);
            }
        }
    </style>

<script>
        // Séquence d'animation de chargement Code Lyoko
        const loadingMessages = [
            { text: '> Vérification des permissions d\'accès', delay: 1800 },
            { text: '> Identification du niveau de sécurité', delay: 1600 },
            { text: '> Analyse des droits utilisateur', delay: 2000 },
            { text: '> Secteur protégé - Accès refusé', delay: 2400 },
            { text: '> ERREUR 403 - Accès interdit', delay: 2000, error: true }
        ];

        const loadingContent = document.getElementById('loadingContent');
        const loadingScreen = document.getElementById('loadingScreen');
        const mainContent = document.getElementById('mainContent');

        let currentIndex = 0;
        let currentMessage = null;

        function typeWriter(element, text, speed = 50) {
            return new Promise((resolve) => {
                let i = 0;
                element.textContent = '';

                function type() {
                    if (i < text.length) {
                        element.textContent += text.charAt(i);
                        i++;
                        setTimeout(type, speed);
                    } else {
                        resolve();
                    }
                }

                type();
            });
        }

        async function showNextMessage() {
            if (currentIndex < loadingMessages.length) {
                const msg = loadingMessages[currentIndex];

                // Supprimer l'ancien message avec fade out
                if (currentMessage) {
                    currentMessage.style.animation = 'fadeOut 0.4s ease-out forwards';
                    await new Promise(resolve => setTimeout(resolve, 400));
                    currentMessage.remove();
                }

                // Créer le nouveau message
                const messageDiv = document.createElement('div');
                messageDiv.className = 'loading-message';

                if (msg.error) {
                    messageDiv.classList.add('error-glitch');
                }

                loadingContent.appendChild(messageDiv);
                currentMessage = messageDiv;

                // Effet typing
                messageDiv.style.opacity = '1';
                await typeWriter(messageDiv, msg.text, 40);

                // Ajouter un curseur clignotant temporaire
                const cursor = document.createElement('span');
                cursor.textContent = '_';
                cursor.style.animation = 'blink 0.8s step-end infinite';
                messageDiv.appendChild(cursor);

                currentIndex++;

                // Pause avant le prochain message
                await new Promise(resolve => setTimeout(resolve, msg.delay));

                // Retirer le curseur
                if (cursor.parentNode) {
                    cursor.remove();
                }

                showNextMessage();
            } else {
                // Fin de la séquence, afficher le contenu principal
                if (currentMessage) {
                    currentMessage.style.animation = 'fadeOut 0.5s ease-out forwards';
                }

                setTimeout(() => {
                    loadingScreen.classList.add('hidden');
                    setTimeout(() => {
                        loadingScreen.style.display = 'none';
                    }, 500);
                }, 600);
            }
        }

        // Démarrer l'animation au chargement de la page
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                showNextMessage();
            }, 500);
        });

        // Adapter la hauteur en fonction du viewport
        function adjustHeight() {
            const vh = window.innerHeight * 0.01;
            document.documentElement.style.setProperty('--vh', `${vh}px`);
        }

        adjustHeight();
        window.addEventListener('resize', adjustHeight);
        window.addEventListener('orientationchange', adjustHeight);
    </script>
