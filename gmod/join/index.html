    <script>
      function redirectNow() {
        // Trigger the Steam protocol connection immediately
        window.location.href = "steam://connect/72.62.238.16:27015?appid=4000";
        // Fade out the page
        document.body.style.animation = "fadeOut 0.5s ease forwards";

          window.close();
        }, 5000);

      window.onload = () => {
        redirectNow();
