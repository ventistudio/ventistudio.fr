<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
  <meta name="description" content="VentiStudio - Serveur en maintenance.">
  <meta name="theme-color" content="#6366f1">
  <title>Maintenance | VentiStudio</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap');

    :root {
      --primary: #7B66FF;
      --secondary: #2A2D3A;
      --background: #1A1B26;
      --text: #FFFFFF;
      --hover: #9F86FF;
      --accent1: #414868;
      --accent2: #565f89;
      --warning: #f0a500;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      background-color: var(--background);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Arrière-plan animé */
    .bg-grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(123,102,255,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(123,102,255,0.05) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: 0;
      pointer-events: none;
    }

    .bg-glow {
      position: fixed;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(123,102,255,0.12) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 0;
      pointer-events: none;
      animation: pulse-glow 4s ease-in-out infinite;
    }

    @keyframes pulse-glow {
      0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
      50%       { opacity: 1;   transform: translate(-50%, -50%) scale(1.1); }
    }

    /* Contenu principal */
    .maintenance-wrapper {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2.5rem;
      padding: 2rem;
      max-width: 820px;
      width: 100%;
      text-align: center;
    }

    /* Icône / Badge */
    .maintenance-icon {
      font-size: 5rem;
      line-height: 1;
      animation: spin-pause 6s linear infinite;
      filter: drop-shadow(0 0 18px rgba(240,165,0,0.6));
    }

    @keyframes spin-pause {
      0%   { transform: rotate(0deg); }
      80%  { transform: rotate(360deg); }
      100% { transform: rotate(360deg); }
    }

    /* Titre fixe */
    .maintenance-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(240,165,0,0.15);
      border: 1px solid rgba(240,165,0,0.4);
      color: var(--warning);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 0.4rem 1rem;
      border-radius: 999px;
    }

    /* Carte message multilingue */
    .message-card {
      background: var(--secondary);
      border: 1px solid var(--accent1);
      border-radius: 16px;
      padding: 2.5rem 3rem;
      width: 100%;
      min-height: 220px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.2rem;
      box-shadow: 0 8px 40px rgba(0,0,0,0.4);
      position: relative;
    }

    .lang-badge {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--hover);
      background: rgba(123,102,255,0.15);
      border: 1px solid rgba(123,102,255,0.3);
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
    }

    .message-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(1.5rem, 4vw, 2.2rem);
      font-weight: 700;
      color: var(--warning);
      margin: 0;
      line-height: 1.2;
      word-break: break-word;
    }

    .message-body {
      font-size: clamp(0.95rem, 2vw, 1.15rem);
      color: rgba(255,255,255,0.82);
      margin: 0;
      line-height: 1.7;
      max-width: 640px;
      word-break: break-word;
    }

    /* Wrapper langue – pas de transition globale, les chars gèrent tout */
    .lang-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.8rem;
      width: 100%;
    }

    /* Réécriture progressive : chaque caractère apparition */
    @keyframes char-appear {
      from { opacity: 0; filter: blur(6px); transform: translateY(-5px); }
      to   { opacity: 1; filter: blur(0);   transform: translateY(0);    }
    }

    /* Réécriture progressive : chaque caractère disparition */
    @keyframes char-disappear {
      from { opacity: 1; filter: blur(0);   transform: translateY(0);   }
      to   { opacity: 0; filter: blur(6px); transform: translateY(5px); }
    }

    .char {
      display: inline;
      opacity: 0;
      animation: char-appear 0.25s ease forwards;
    }

    /* Indicateurs de langue (points) */
    .lang-dots {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .lang-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent2);
      transition: background 0.4s ease, transform 0.3s ease;
    }

    .lang-dot.active {
      background: var(--primary);
      transform: scale(1.4);
    }

    /* Barre de progression */
    .progress-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: var(--accent1);
      overflow: hidden;
      z-index: 10;
    }

    .progress {
      height: 100%;
      background: var(--warning);
      position: absolute;
      left: -50%;
      width: 50%;
      animation: loading 2s infinite ease-in-out;
      box-shadow: 0 0 10px var(--warning);
    }

    @keyframes loading {
      0%   { left: -50%; }
      100% { left: 100%; }
    }

    /* QR Code */
    .qr-code-container {
      position: fixed;
      top: 20px;
      right: 20px;
      background: var(--secondary);
      padding: 10px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      z-index: 100;
      opacity: 1;
      transition: opacity 0.5s ease-out;
    }

    .qr-code-container.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .qr-code-container img {
      width: 120px;
      height: 120px;
      display: block;
    }

    .qr-code-label {
      text-align: center;
      font-size: 0.7rem;
      color: var(--hover);
      margin-top: 4px;
      font-weight: 600;
    }

    /* Audio */
    .audio-controls {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background: rgba(255,255,255,0.08);
      padding: 8px 14px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 10;
    }

    .now-playing {
      color: var(--text);
      font-size: 0.78rem;
      opacity: 0.7;
    }

    /* Scroll custom */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--background); }
    ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 4px; }

    @media (max-width: 600px) {
      .message-card { padding: 1.5rem; min-height: 200px; }
      .maintenance-icon { font-size: 3.5rem; }
    }
  </style>

  <script async crossorigin="anonymous" src="https://clerk.ventistudio.eu/npm/@clerk/ui@1/dist/ui.browser.js" type="text/javascript"></script>
  <script async crossorigin="anonymous" data-clerk-publishable-key="pk_live_Y2xlcmsudmVudGlzdHVkaW8uZXUk" src="https://clerk.ventistudio.eu/npm/@clerk/clerk-js@6/dist/clerk.browser.js" type="text/javascript"></script>

  <meta property="og:description" content="VentiStudio - Serveur en maintenance.">
  <meta property="og:url" content="https://ventistudio.eu/gmod/load/maintenance/">
  <meta property="og:image" content="https://ventistudio.eu/favicon.avif">
  <meta property="og:type" content="website">
  <link rel="canonical" href="https://ventistudio.eu/gmod/load/maintenance/">

  <script>
    (function() {
      var t = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <script src="/i18n.js" defer></script>
</head>
<body>

  <audio id="bgMusic">
    <source src="" type="audio/mpeg">
  </audio>

  <div class="bg-grid"></div>
  <div class="bg-glow"></div>


  <div class="qr-code-container" id="qrContainer">
    <img src="../files/qrcollection.avif" alt="QR Code - Steam Workshop" />
    <div class="qr-code-label">Steam Workshop</div>
  </div>


  <div class="audio-controls">
    <span class="now-playing" id="nowPlaying"></span>
  </div>


  <div class="maintenance-wrapper">

    <div class="maintenance-icon">⚙️</div>

    <div class="maintenance-badge">
      <span>Serveur en maintenance</span>
    </div>

    <div class="message-card">
      <div class="lang-content" id="langContent">
        <span class="lang-badge" id="langLabel">FR</span>
        <p class="message-title" id="messageTitle"></p>
        <p class="message-body" id="messageBody"></p>
      </div>
      <div class="lang-dots" id="langDots"></div>
    </div>

  </div>

  <div class="progress-bar">
    <div class="progress"></div>
  </div>

  <script>
    // ─── Traductions ────────────────────────────────────────────────────────────
    const translations = [
      { lang: "FR", title: "Maintenance en cours",           body: "Ce serveur est maintenant en fun-rp. Il est fortement déconseillé de se connecter pendant les maintenances." },
      { lang: "EN", title: "Maintenance in progress",        body: "This server is now in fun-rp mode. It is strongly advised not to connect during maintenance." },
      { lang: "JP", title: "メンテナンス中",                    body: "このサーバーは現在ファンRPモードです。メンテナンス中の接続は強くお勧めしません。" },
      { lang: "ES", title: "Mantenimiento en curso",          body: "Este servidor está ahora en modo fun-rp. Se desaconseja encarecidamente conectarse durante el mantenimiento." },
      { lang: "DE", title: "Wartung läuft",                   body: "Dieser Server ist jetzt im Fun-RP-Modus. Es wird dringend davon abgeraten, sich während der Wartung zu verbinden." },
      { lang: "IT", title: "Manutenzione in corso",           body: "Questo server è ora in modalità fun-rp. Si sconsiglia vivamente di connettersi durante la manutenzione." },
      { lang: "PT", title: "Manutenção em andamento",         body: "Este servidor está agora no modo fun-rp. É fortemente desaconselhado conectar-se durante a manutenção." },
      { lang: "RU", title: "Техническое обслуживание",        body: "Этот сервер сейчас в режиме fun-rp. Настоятельно не рекомендуется подключаться во время обслуживания." },
      { lang: "ZH", title: "维护中",                           body: "此服务器目前处于趣味RP模式。强烈建议不要在维护期间连接。" },
      { lang: "KO", title: "유지보수 중",                       body: "이 서버는 현재 펀 RP 모드입니다. 유지보수 중에는 연결하지 않는 것이 강력히 권장됩니다." },
      { lang: "AR", title: "الصيانة جارية",                    body: "هذا الخادم الآن في وضع fun-rp. يُنصح بشدة بعدم الاتصال أثناء الصيانة." },
      { lang: "NL", title: "Onderhoud bezig",                  body: "Deze server is nu in fun-rp modus. Het wordt sterk afgeraden om verbinding te maken tijdens onderhoud." },
      { lang: "PL", title: "Konserwacja w toku",               body: "Ten serwer jest teraz w trybie fun-rp. Zdecydowanie odradza się łączenie podczas konserwacji." },
      { lang: "TR", title: "Bakım devam ediyor",               body: "Bu sunucu artık fun-rp modunda. Bakım sırasında bağlanmak kesinlikle tavsiye edilmez." },
      { lang: "SV", title: "Underhåll pågår",                  body: "Den här servern är nu i fun-rp-läge. Det avråds starkt från att ansluta under underhåll." },
      { lang: "NO", title: "Vedlikehold pågår",                body: "Denne serveren er nå i fun-rp-modus. Det frarådes sterkt å koble til under vedlikehold." },
      { lang: "DA", title: "Vedligeholdelse i gang",           body: "Denne server er nu i fun-rp-tilstand. Det frarådes kraftigt at forbinde under vedligeholdelse." },
      { lang: "FI", title: "Huolto käynnissä",                 body: "Tämä palvelin on nyt fun-rp-tilassa. Yhdistämistä huollon aikana ei suositella." },
      { lang: "CS", title: "Probíhá údržba",                   body: "Tento server je nyní v režimu fun-rp. Důrazně se nedoporučuje připojovat se během údržby." },
      { lang: "HU", title: "Karbantartás folyamatban",         body: "Ez a szerver most fun-rp módban van. Erősen ajánlott nem csatlakozni karbantartás alatt." },
      { lang: "RO", title: "Mentenanță în curs",               body: "Acest server este acum în modul fun-rp. Este puternic descurajat să vă conectați în timpul mentenanței." },
      { lang: "UK", title: "Технічне обслуговування",          body: "Цей сервер зараз у режимі fun-rp. Наполегливо рекомендується не підключатися під час обслуговування." },
      { lang: "VI", title: "Đang bảo trì",                     body: "Máy chủ này hiện đang ở chế độ fun-rp. Không nên kết nối trong thời gian bảo trì." },
      { lang: "TH", title: "กำลังดูแลระบบ",                    body: "เซิร์ฟเวอร์นี้อยู่ในโหมด fun-rp ขณะนี้ ไม่แนะนำให้เชื่อมต่อในระหว่างการบำรุงรักษา" },
      { lang: "ID", title: "Pemeliharaan berlangsung",         body: "Server ini sekarang dalam mode fun-rp. Sangat disarankan untuk tidak terhubung saat pemeliharaan." },
      { lang: "HE", title: "תחזוקה מתבצעת",                    body: "שרת זה כעת במצב fun-rp. מומלץ בחום לא להתחבר במהלך התחזוקה." },
      { lang: "EL", title: "Σε εξέλιξη η συντήρηση",            body: "Αυτός ο διακομιστής είναι τώρα σε λειτουργία fun-rp. Συνιστάται έντονα να μην συνδεθείτε κατά τη διάρκεια της συντήρησης." }
    ];

    // ─── DOM ────────────────────────────────────────────────────────────────────
    const langContent = document.getElementById('langContent');
    const langLabel   = document.getElementById('langLabel');
    const msgTitle    = document.getElementById('messageTitle');
    const msgBody     = document.getElementById('messageBody');
    const dotsWrapper = document.getElementById('langDots');

    // Créer les points indicateurs
    translations.forEach((_, i) => {
      const dot = document.createElement('div');
      dot.className = 'lang-dot' + (i === 0 ? ' active' : '');
      dotsWrapper.appendChild(dot);
    });

    let currentIndex = 0;

    function updateDots(index) {
      document.querySelectorAll('.lang-dot').forEach((dot, i) => {
        dot.classList.toggle('active', i === index);
      });
    }

    // Constantes de timing
    const CHAR_OUT_DELAY  = 6;   // ms entre chaque char en sortie
    const CHAR_OUT_DUR    = 200; // ms durée animation disparition
    const CHAR_IN_DELAY   = 12;  // ms entre chaque char en entrée
    const CHAR_IN_DUR     = 250; // ms durée animation apparition

    // Injecte les caractères avec animation d'apparition
    function buildTypedText(el, text, offsetDelay) {
      el.innerHTML = '';
      [...text].forEach((char, i) => {
        const span = document.createElement('span');
        span.className = 'char';
        span.style.animationDelay = (offsetDelay + i * CHAR_IN_DELAY) + 'ms';
        span.textContent = char === ' ' ? '\u00A0' : char;
        el.appendChild(span);
      });
    }

    // Fait disparaître les chars existants lettre par lettre, puis appelle callback
    function fadeOutChars(callback) {
      const allChars = [
        ...msgTitle.querySelectorAll('.char'),
        ...msgBody.querySelectorAll('.char')
      ];
      if (allChars.length === 0) { callback(); return; }

      allChars.forEach((span, i) => {
        // Annule toute animation en cours et force l'état visible
        span.style.animation = 'none';
        span.style.opacity   = '1';
        span.style.filter    = 'blur(0)';
        span.style.transform = 'translateY(0)';
        void span.offsetWidth; // reflow
        // Lance l'animation de disparition avec décalage
        span.style.animation      = `char-disappear ${CHAR_OUT_DUR}ms ease forwards`;
        span.style.animationDelay = (i * CHAR_OUT_DELAY) + 'ms';
      });

      setTimeout(callback, allChars.length * CHAR_OUT_DELAY + CHAR_OUT_DUR);
    }

    function showTranslation(index) {
      const t = translations[index];

      // 1. Disparition progressive lettre par lettre
      fadeOutChars(() => {
        // 2. Mise à jour badge langue + points
        langLabel.textContent = t.lang;
        updateDots(index);

        // 3. Apparition progressive lettre par lettre (titre puis corps)
        const bodyDelay = t.title.length * CHAR_IN_DELAY + 60;
        buildTypedText(msgTitle, t.title, 0);
        buildTypedText(msgBody,  t.body,  bodyDelay);
      });
    }

    // Initialisation : affiche la première traduction en chars
    (function () {
      const t = translations[0];
      langLabel.textContent = t.lang;
      const bodyDelay = t.title.length * CHAR_IN_DELAY + 60;
      buildTypedText(msgTitle, t.title, 0);
      buildTypedText(msgBody,  t.body,  bodyDelay);
    })();

    // Rotation toutes les 5 secondes
    setInterval(() => {
      currentIndex = (currentIndex + 1) % translations.length;
      showTranslation(currentIndex);
    }, 5000);

    // ─── QR Code ─────────────────────────────────────────────────────────────
    setTimeout(() => {
      document.getElementById('qrContainer').classList.add('hidden');
    }, 60000);

    // ─── Musique ─────────────────────────────────────────────────────────────
    const playlist = [
      { title: "Lost Site",   artist: "Venti Opastudien", src: "https://ventistudio.eu/gmod/music/ls1.wav" },
      { title: "SCP Celeste", artist: "Galshi",           src: "https://ventistudio.eu/gmod/music/sc1.wav" }
    ];

    document.addEventListener('DOMContentLoaded', function () {
      const audio       = document.getElementById('bgMusic');
      const nowPlaying  = document.getElementById('nowPlaying');

      audio.volume = 0.15;

      let currentTrackIndex = 0;

      function forceAutoplay() {
        const attempt = setInterval(() => {
          audio.play().then(() => clearInterval(attempt)).catch(() => {});
        }, 500);
      }

      function loadAndPlay(index) {
        const track = playlist[index];
        audio.src = track.src;
        nowPlaying.textContent = `${track.title} : ${track.artist}`;
        audio.load();
        forceAutoplay();
      }

      function playRandom() {
        const prev = currentTrackIndex;
        do { currentTrackIndex = Math.floor(Math.random() * playlist.length); }
        while (playlist.length > 1 && currentTrackIndex === prev);
        loadAndPlay(currentTrackIndex);
      }

      playRandom();

      audio.addEventListener('ended', playRandom);

      document.addEventListener('click', () => {
        if (audio.paused) forceAutoplay();
      }, { once: true });

      document.addEventListener('visibilitychange', () => {
        if (document.hidden) audio.pause();
        else forceAutoplay();
      });
    });
  </script>
  <script src="/main.js" defer></script>
</body>
