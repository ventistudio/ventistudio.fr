<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Célébrations et anniversaires de la communauté VentiStudio.">
  <meta name="theme-color" content="#6366f1">
  <title>Anniversaire | VentiStudio</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    h1 {
      font-size: clamp(1.8rem, 5vw, 3rem);
      text-align: center;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #ffd36b, #ff8e3c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      text-align: center;
      font-size: 1.1rem;
      color: #c0b8e0;
      margin-bottom: 40px;
    }

    /* ===== CANDLES ===== */
    .candles {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-bottom: 16px;
    }

    .candle {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .flame-wrapper {
      position: relative;
      width: 14px;
      height: 22px;
      margin-bottom: 2px;
    }

    .flame {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 10px;
      height: 18px;
      background: radial-gradient(ellipse at center bottom, #fff 0%, #ffe066 30%, #ff9500 60%, transparent 100%);
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      animation: flicker 0.4s ease-in-out infinite alternate;
    }

    .flame::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 50%;
      transform: translateX(-50%);
      width: 6px;
      height: 6px;
      background: #4dc8ff;
      border-radius: 50%;
      opacity: .6;
    }

    .stick {
      width: 6px;
      height: 36px;
      border-radius: 3px;
    }

    .stick-pink { background: linear-gradient(180deg, #f8a0c0, #e87baf); }
    .stick-yellow { background: linear-gradient(180deg, #ffe680, #f8c06a); }
    .stick-blue { background: linear-gradient(180deg, #a0d8f0, #5ab8e0); }

    @keyframes flicker {
      0% { transform: translateX(-50%) scale(1) rotate(-2deg); opacity: 1; }
      100% { transform: translateX(-50%) scale(1.1) rotate(2deg); opacity: .85; }
    }

    /* ===== YEARS DISPLAY ===== */
    .years-display {
      text-align: center;
      margin-bottom: 30px;
    }

    .years-number {
      font-size: clamp(5rem, 15vw, 10rem);
      font-weight: 900;
      background: linear-gradient(180deg, #ffd36b, #ff8e3c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      text-shadow: none;
      filter: drop-shadow(0 4px 20px rgba(255,142,60,.4));
    }

    .years-label {
      font-size: 1.4rem;
      font-weight: 600;
      color: #c0b8e0;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-top: 4px;
    }

    /* Info text */
    .info {
      margin-top: 36px;
      text-align: center;
      color: #a898c8;
      font-size: .95rem;
    }

    .info strong {
      color: #ffd36b;
    }

    /* ===== CONFETTI ===== */
    .confetti-container {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .confetti {
      position: absolute;
      top: -20px;
      width: 10px;
      height: 10px;
      opacity: .8;
      animation: fall linear infinite;
    }

    @keyframes fall {
      0% { transform: translateY(-10px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(105vh) rotate(720deg); opacity: 0; }
    }

    .content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    /* Footer */
    .page-footer {
      margin-top: 50px;
      text-align: center;
      font-size: .8rem;
      color: #6a6088;
    }
  </style>

  <script async crossorigin="anonymous" src="https://clerk.ventistudio.eu/npm/@clerk/ui@1/dist/ui.browser.js" type="text/javascript"></script>
  <script async crossorigin="anonymous" data-clerk-publishable-key="pk_live_Y2xlcmsudmVudGlzdHVkaW8uZXUk" src="https://clerk.ventistudio.eu/npm/@clerk/clerk-js@6/dist/clerk.browser.js" type="text/javascript"></script>

  <meta property="og:title" content="Anniversaire | VentiStudio">
  <meta property="og:description" content="Célébrations et anniversaires de la communauté VentiStudio.">
  <meta property="og:url" content="https://ventistudio.eu/birthday/">
  <meta property="og:image" content="https://ventistudio.eu/favicon.avif">
  <meta property="og:type" content="website">
  <link rel="canonical" href="https://ventistudio.eu/birthday/">
</head>
<body>

  <div class="confetti-container" id="confetti"></div>

  <div class="content">
    <h1 id="title">Joyeux anniversaire VentiStudio&nbsp;!</h1>
    <p class="subtitle" id="subtitle"></p>

    <div class="candles" id="candles"></div>

    <div class="years-display">
      <div class="years-number" id="years-number"></div>
      <div class="years-label">ans</div>
    </div>

    <p class="info">
      Fond&eacute; en <strong>2016</strong>
      <span id="years-text"></span> d&rsquo;aventure, de cr&eacute;ation et de passion.
    </p>

    <div class="page-footer">
      &copy; <span id="copy-year"></span> Venti Opastudien &bull; VentiStudio FiTsZ
    </div>
  </div>

  <script>
    (function () {
      const FOUNDING_YEAR = 2016;
      const now = new Date();
      const currentYear = now.getFullYear();
      const years = currentYear - FOUNDING_YEAR;

      // Years display
      document.getElementById('years-number').textContent = years;
      document.getElementById('years-text').textContent = years + ' ans';
      document.getElementById('subtitle').textContent =
        'VentiStudio illumine vos exp\u00e9riences depuis ' + FOUNDING_YEAR;
      document.getElementById('copy-year').textContent = currentYear;

      // Candles
      const candlesEl = document.getElementById('candles');
      const displayCount = Math.min(years, 12);
      const stickClasses = ['stick-pink', 'stick-yellow', 'stick-blue'];
      for (let i = 0; i < displayCount; i++) {
        const candle = document.createElement('div');
        candle.className = 'candle';
        candle.innerHTML =
          '<div class="flame-wrapper"><div class="flame"></div></div>' +
          '<div class="stick ' + stickClasses[i % 3] + '"></div>';
        candle.querySelector('.flame').style.animationDelay = (Math.random() * 0.4) + 's';
        candlesEl.appendChild(candle);
      }

      // Confetti
      const container = document.getElementById('confetti');
      const colors = ['#ffd36b','#ff8e3c','#e87baf','#5ab8e0','#89d4f5','#a0f0a0','#fff'];
      const shapes = ['circle','square'];
      for (let i = 0; i < 60; i++) {
        const el = document.createElement('div');
        el.className = 'confetti';
        const size = 6 + Math.random() * 10;
        el.style.width = size + 'px';
        el.style.height = size + 'px';
        el.style.left = Math.random() * 100 + '%';
        el.style.background = colors[Math.floor(Math.random() * colors.length)];
        el.style.borderRadius = shapes[Math.floor(Math.random() * 2)] === 'circle' ? '50%' : '2px';
        el.style.animationDuration = (4 + Math.random() * 6) + 's';
        el.style.animationDelay = (Math.random() * 8) + 's';
        container.appendChild(el);
      }
    })();
  </script>
</body>
</html>
